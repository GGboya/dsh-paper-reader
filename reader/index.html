<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文伴读 · dsh-paper-reader</title>
<!-- pdf.js 6.x 本地 vendor（不再走 CDN）：3.11 的字体解析对 babeldoc 嵌入的 CID 字体会回退成黑体。
     不用 <script type="module">：module 是 defer 语义（整页解析完 + 458KB 拉取编译完才执行），
     而底部经典脚本在解析期就开跑 bootstrap()，库里有论文时先到 loadPdf，此刻 window.pdfjsLib
     还没就绪 → "pdfjsLib is not defined"。改为经典脚本里动态 import()（见 ensurePdfjs），顺序有保证。 -->
<!-- KaTeX 0.16.22 本地 vendor（数学渲染；论文伴读是**离线场景**，绝不引 CDN）。
     经典脚本：页面解析期同步设置 window.katex；缺失时渲染路径会**降级**为原始 LaTeX（见 trRenderBody）。
     体积与来源见 reader/vendor/katex.NOTICE.md。 -->
<link rel="stylesheet" href="/paper-reader/vendor/katex.min.css">
<script src="/paper-reader/vendor/katex.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #24292f;
    --text-2: #656d76; --accent: #0969da; --accent-soft: rgba(9,105,218,.12);
    --hl: rgba(255, 196, 0, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.6 -apple-system, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  /* ---------- 顶栏 ----------
     flex-wrap —— 窄列（rightbar 可拖到 ~300px）下按钮放不下时换行到第二行，
     而不是向右溢出被 iframe 裁掉（v1.3.2 前的坑：＋/适宽 被挤出可视区，用户实测） */
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; row-gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
  #bar button { font: inherit; }
  /* flex:none —— 列被拖窄时按钮不许被压缩（否则文字竖排、按钮变窄条） */
  /* inline-flex + 固定高：图标/文字统一垂直居中，按钮高度不再随各家字体字形漂移 */
  .tbtn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  .tbtn:hover { background: var(--bg); }
  .tbtn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tbtn:disabled { opacity: .45; cursor: default; }
  /* 统一 SVG 图标：stroke=currentColor，active/disabled 的变色自动继承到图标 */
  .tbtn svg.ic { width: 16px; height: 16px; flex: none; }
  .tbtn svg.spin { transform-origin: center; animation: dpr-spin 1s linear infinite; }
  @keyframes dpr-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tbtn svg.spin { animation-duration: 2.4s; } }
  #zoom-label { flex: none; min-width: 44px; text-align: center; color: var(--text-2); }
  #bar .spacer { flex: 1; }
  /* min-width:0 —— flex 项默认 min-width:auto 会拒绝收缩，空间不够时转而去挤按钮；
     让标题自己截断（已有 ellipsis），按钮才能保持原样 */
  #status { flex: 0 1 auto; min-width: 0; color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 翻译进度条（只在生成中文版时出现）：细长条 + 阶段文字，宽度跟着 babeldoc 的 overall 走 */
  #zh-prog { flex: 0 1 auto; min-width: 0; max-width: 46%; display: inline-flex; align-items: center; gap: 7px; }
  #zh-prog[hidden] { display: none; }
  #zh-prog .track { position: relative; flex: 1 1 auto; min-width: 48px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  #zh-prog .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 3px; background: var(--accent); transition: width .35s ease; }
  #zh-prog .txt { flex: none; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { #zh-prog .fill { transition: none; } }
  /* PDF 文件路径：可点的只读文本（点击复制）。⚠️ 必须可收缩（flex:0 1 auto + min-width:0）——
     它是最长的内容项，窄列时先让位给按钮、自己截断（title 悬停始终有完整路径），
     曾经 max-width:34% + flex:none 在窄列把 ＋/适宽 挤出可视区（用户实测） */
  #pdf-path { flex: 0 1 auto; min-width: 0; max-width: 34%; padding: 0; border: none; background: none; color: var(--text-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #pdf-path:hover { color: var(--accent); }
  /* 窄列（<560px）：版本号让位——它只是排障辅助信息 */
  @media (max-width: 560px) { #ver { display: none; } }

  /* ---------- PDF 区 ---------- */
  /* #split-wrap 是分屏（模式 B）的两列行容器：非分屏时只有原文列，行为与改造前一致。
     #pdf-pane 从 #main 的直接子节点变成它的子节点——#main 的 flex 语义不变。 */
  #main { display: flex; flex: 1; min-height: 0; position: relative; } /* relative：公式面板绝对定位的锚 */
  #split-wrap { display: flex; flex-direction: row; gap: 8px; flex: 1; min-width: 0; }
  #pdf-pane { flex: 1 1 0; min-width: 0; overflow: auto; padding: 16px; }
  /* 中文列（仅分屏出现）：与原文列同权重、各自滚动 */
  #pdf-pane-zh { flex: 1 1 0; min-width: 0; overflow: auto; padding: 16px; display: none; }
  #split-wrap.on > #pdf-pane-zh { display: block; }
  .pane-label { display: none; position: sticky; top: -16px; z-index: 3; background: var(--bg); color: var(--text-2);
    font-size: 12px; font-weight: 600; padding: 2px 0 6px; }
  #split-wrap.on .pane-label { display: block; }
  /* safe center：页宽超过视口时退回左对齐——普通 center 会让左右同时溢出且左侧滚不到 */
  #pdf-pages { display: flex; flex-direction: column; align-items: safe center; gap: 14px; }
  #pdf-pages-zh { display: flex; flex-direction: column; align-items: safe center; gap: 14px; }
  /* 翻页模式：单页垂直居中（safe center 同理，放大后顶部仍可滚到） */
  #pdf-pages.paged, #pdf-pages-zh.paged { min-height: 100%; justify-content: safe center; gap: 0; }

  /* ---------- 翻页控件 ---------- */
  #pager { display: flex; align-items: center; gap: 4px; flex: none; }
  /* 数字居中：text-align:right 会让单页码贴右框边、左侧空一块；
     上 padding 多 1px —— 数字无下伸部，光字心本就偏高，对称内边距看起来反而偏上 */
  #page-input { width: 3.5em; padding: 4px 6px 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; font-size: 12.5px; line-height: 20px; text-align: center; }
  #page-total { flex: none; color: var(--text-2); font-size: 12px; white-space: nowrap; }
  /* 插件版本号（host 注入；未被替换时隐藏——比如旧 host 配新页面的错位场景） */
  #ver { flex: none; font-size: 10.5px; color: var(--text-2); opacity: .65; user-select: none; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .page.flash { outline: 3px solid var(--hl); outline-offset: 2px; transition: outline .15s; }
  /* textLayer CSS 必须是 pdf.js 6.x 官方规则的子集：TextLayer 只往 span 写 --font-height/--scale-x/--rotate
     变量，font-size 和 transform 全靠这里的 calc 表达式撑开；缺了的话 span 会按 body 字号渲染，
     盒子与 canvas 字形错位 —— 表现为选中高亮缺字符。--scale-factor 由 JS 在渲染时写入 */
  .textLayer {
    position: absolute; inset: 0; overflow: clip; line-height: 1; text-align: initial;
    letter-spacing: normal; word-spacing: normal; text-size-adjust: none;
    forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 0;
    --total-scale-factor: calc(var(--scale-factor, 1) * var(--user-unit, 1));
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size, 1));
    --min-font-size-inv: calc(1 / var(--min-font-size, 1));
    --scale-round-x: 1px; --scale-round-y: 1px;
  }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; user-select: text; }
  .textLayer > :not(.markedContent),
  .textLayer .markedContent span:not(.markedContent) {
    z-index: 1;
    --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(22,93,255,.3); }
  .textLayer br::selection { background: transparent; }
  /* 跳转链接的片段高亮（&q= 引文定位）：常驻不淡出，用户在阅读器里任意点一下即消
     （同代码编辑器的选中高亮语义：消失由用户触发，不由计时器触发） */
  .textLayer span.dpr-hl { background: rgba(255,196,0,.45); border-radius: 2px; }
  #empty { margin: 60px auto; color: var(--text-2); text-align: center; max-width: 420px; }

  /* ---------- 公式引用（MinerU bbox 热区 + 列表面板）----------
     契约 §1.3/§1.4：热区**不用** pointer-events:auto 的覆盖层——那会夺走 textLayer 的
     mousedown/拖拽，破坏既有划词提问。这里 .eqLayer 只负责画描边（pointer-events:none），
     命中判定在 JS 里按坐标算。 */
  .eqLayer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .eq-box { position: absolute; border-radius: 3px; }
  .eq-box.hover { outline: 1.5px dashed rgba(9,105,218,.85); background: rgba(9,105,218,.07); }
  .eq-box.hit { outline: 2px solid rgba(255,140,0,.9); background: rgba(255,196,0,.16); }
  #eq-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 88%); display: none;
    background: var(--panel); border-left: 1px solid var(--border); box-shadow: -4px 0 16px rgba(0,0,0,.08);
    overflow: auto; z-index: 3; padding: 10px 12px; }
  #eq-panel h3 { margin: 0 0 4px; font-size: 13px; }
  #eq-meta { font-size: 11.5px; color: var(--text-2); margin-bottom: 6px; line-height: 1.5; }
  .eq-page { margin: 10px 0 2px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .eq-item { display: block; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); padding: 6px 8px; margin: 4px 0; cursor: pointer; font: inherit; }
  .eq-item:hover { border-color: var(--accent); }
  .eq-item code { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
    white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .eq-item .eq-tag { font-size: 11px; color: var(--text-2); }
  #eq-note { font-size: 12px; color: var(--text-2); line-height: 1.6; }
  #eq-transcribe { margin-top: 8px; }
  #eq-toggle.muted { opacity: .55; }
  #ask-copy { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-2); cursor: pointer; margin-right: auto; }

  /* ---------- 在文中查找（顶栏 🔍 / Ctrl+F）----------
     输入框与结果列表在**同一个浮窗**里：窗口可拖动、可拖边框改大小，开关只有窗口一件事，
     不再有「输入条」和「结果面板」两套入口。页内高亮是 .findLayer 里的百分比盒子
     （Range.getClientRects 算出来的词级矩形）：不给 span 加背景类——span 常常是一整行，
     而且加类会动 textLayer 的换行与划词。 */
  #find-tools { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; }
  #find-input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit;
    font-size: 12.5px; line-height: 18px; background: var(--panel); color: var(--text); }
  #find-input:focus { outline: none; border-color: var(--accent); }
  #find-count { flex: none; min-width: 44px; max-width: 96px; text-align: center; font-size: 12px; color: var(--text-2);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #find-count.hit { color: var(--accent); }
  #find-count:empty { display: none; }
  /* 查找浮窗：输入行 + 结果列表装在一起，可拖动、可拖边框改大小，默认 330×340，不占满阅读区。
     旧版用右侧滑出面板占满整列高度，会遮住半页纸，所以改成浮窗。 */
  #find-window { position: fixed; z-index: 46; display: none; flex-direction: column; width: 330px; height: 340px;
    min-width: 240px; min-height: 190px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; }
  #find-window.on { display: flex; }
  #find-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: move; user-select: none;
    border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 600; flex: none; }
  #find-head .spacer { flex: 1; }
  #find-headcount { font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }
  #find-meta { padding: 6px 10px 2px; font-size: 11.5px; color: var(--text-2); line-height: 1.5; flex: none; }
  /* 列表自己滚：头部与说明固定在窗口上沿，关按钮永远在最上面看得见 */
  #find-list { flex: 1; overflow: auto; padding: 2px 8px 10px; }
  #find-grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 2; }
  #find-grip::after { content: ''; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px;
    border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); border-bottom-right-radius: 3px; opacity: .55; }
  /* 右边缘 / 下边缘也能拖：整条边都是热区，不用非得瞄准右下角那 16px */
  #find-grip-r { position: absolute; top: 68px; right: 0; bottom: 16px; width: 6px; cursor: ew-resize; z-index: 2; }
  #find-grip-b { position: absolute; left: 0; right: 16px; bottom: 0; height: 6px; cursor: ns-resize; z-index: 2; }
  .tbtn.mini { height: 24px; padding: 0 6px; border-radius: 5px; }
  .tbtn.mini svg.ic { width: 14px; height: 14px; }
  #find-window .tbtn.mini.on { border-color: var(--accent); color: var(--accent); }
  .find-page { margin: 10px 0 2px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .find-item { display: block; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); padding: 5px 8px; margin: 3px 0; cursor: pointer;
    font: inherit; font-size: 12px; line-height: 1.5; }
  .find-item:hover { border-color: var(--accent); }
  .find-item.cur { border-color: var(--accent); background: var(--accent-soft); }
  .find-item mark { background: rgba(255,196,0,.55); color: inherit; border-radius: 2px; padding: 0 1px; }
  .findLayer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .find-box { position: absolute; border-radius: 2px; background: rgba(255,214,0,.45); }
  .find-box.cur { background: rgba(255,146,0,.55); box-shadow: 0 0 0 1.5px rgba(230,110,0,.85); }
  /* 兜底高亮：Range 几何算不出来时给 span 加类（宁可糙一点，也不能「搜到了却看不见」） */
  .textLayer span.find-hit { background: rgba(255,214,0,.45); border-radius: 2px; }
  .textLayer span.find-hit.cur { background: rgba(255,146,0,.55); }

  /* ---------- 笔记（划词标注 + 可移动笔记窗口） ----------
     标注用「百分比盒子 + 底部波浪底图」而不是给 span 加 text-decoration：一个选区常跨多个 span，
     加类会把整行都画上波浪线（与查找高亮同一条教训）。盒子层 pointer-events:none，
     悬停/点击靠坐标命中测试，不会挡住划词选字。 */
  .noteLayer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .note-under { position: absolute; border-radius: 2px; pointer-events: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='4'%3E%3Cpath d='M0 3 Q2.25 .6 4.5 3 T9 3' fill='none' stroke='%232f6bff' stroke-width='1.1'/%3E%3C/svg%3E");
    background-repeat: repeat-x; background-position: 0 100%; background-size: 9px 4px; }
  .note-under.flash { background-color: rgba(47,107,255,.20); }
  #note-tip { position: fixed; z-index: 58; display: none; max-width: 320px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.18);
    padding: 8px 10px; font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; pointer-events: none; }
  #note-tip .tip-hint { display: block; margin-top: 4px; color: var(--text-2); font-size: 11px; }
  /* 划词三动作小菜单（提问 / 全局搜索 / 笔记） */
  #sel-menu { position: fixed; z-index: 52; display: none; gap: 2px; padding: 4px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  #sel-menu.on { display: flex; }
  #sel-menu button { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border: none;
    border-radius: 6px; background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  #sel-menu button:hover { background: var(--accent-soft); color: var(--accent); }
  #sel-menu svg.ic { width: 15px; height: 15px; }
  /* 笔记窗口：与查找窗同一套（可拖动 / 拖边框缩放 / 位置记忆）。列表与编辑器切换显示。 */
  #note-window { position: fixed; z-index: 46; display: none; flex-direction: column; width: 330px; height: 360px;
    min-width: 260px; min-height: 200px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; }
  #note-window.on { display: flex; }
  #note-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: move; user-select: none;
    border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 600; flex: none; }
  #note-head .spacer, #note-actions .spacer { flex: 1; }
  #note-headcount { font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }
  #note-list { flex: 1; overflow: auto; padding: 4px 8px 10px; }
  .note-item { display: block; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); padding: 6px 8px; margin: 5px 0; cursor: pointer; font: inherit; font-size: 12px; line-height: 1.5; }
  .note-item:hover { border-color: var(--accent); }
  .note-item .ni-meta { display: block; color: var(--accent); font-size: 11px; margin-bottom: 2px; }
  .note-item .ni-meta .ni-time { float: right; color: var(--text-2); font-weight: 400; }
  .note-item .ni-body { display: block; white-space: pre-wrap; word-break: break-word; }
  .note-item .ni-quote { display: block; color: var(--text-2); font-size: 11px; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #note-empty { padding: 14px 6px; color: var(--text-2); font-size: 12px; line-height: 1.6; }
  #note-editor { display: none; flex-direction: column; flex: 1; min-height: 0; padding: 6px 8px 8px; }
  #note-window.editing #note-list, #note-window.editing #note-empty { display: none; }
  #note-window.editing #note-editor { display: flex; }
  #note-quote { flex: none; max-height: 72px; overflow: auto; font-size: 11.5px; color: var(--text-2);
    border-left: 3px solid var(--accent-soft); padding-left: 8px; margin-bottom: 6px; }
  #note-body { flex: 1; min-height: 80px; width: 100%; resize: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; font-size: 12.5px; line-height: 1.6; background: var(--panel); color: var(--text); }

  #note-grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 2; }
  #note-grip::after { content: ''; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px;

  #note-grip-r { position: absolute; top: 34px; right: 0; bottom: 16px; width: 6px; cursor: ew-resize; z-index: 2; }

  /* ---------- 选中即问浮层 ---------- */
  #ask-pop { position: fixed; z-index: 50; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px; width: 320px; }
  #ask-quote { font-size: 12px; color: var(--text-2); max-height: 64px; overflow: hidden; margin-bottom: 8px; border-left: 3px solid var(--accent-soft); padding-left: 8px; }
  #ask-input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; resize: none; }
  #ask-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #ask-send { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  #ask-send:disabled { opacity: .5; cursor: default; }
  #ask-cancel { background: none; border: none; color: var(--text-2); cursor: pointer; }
  /* 「译」动作按钮（加法：只在原文视图的纯文字选区出现，见 showAskPop） */
  #ask-translate { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--accent); cursor: pointer; }

  /* ---------- 划词译文气泡 ----------
     用户明确要求：**只显示译文**，不做「插入会话」「复制」按钮 ⇒ 气泡内部零 button 元素。
     提示（诚实降级文案）走独立的 #tr-note，绝不混进 #tr-body。 */
  #tr-pop { position: fixed; z-index: 50; display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px;
    width: min(360px, calc(100vw - 16px)); max-height: 45vh; overflow: auto; }
  #tr-status { font-size: 12px; color: var(--text-2); }
  #tr-status:empty { display: none; }
  #tr-body { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #tr-note { font-size: 12px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
  #tr-note:empty { display: none; }
  /* 公式段：KaTeX 渲染进我们新建的元素（.tr-math / .tr-math-block）；渲染失败时该段落回原始 LaTeX
     文本并加 .tr-math-fallback（可读可复制，绝不留白）。 */
  #tr-body .tr-math-block { margin: 6px 0; overflow-x: auto; }
  #tr-body .tr-math-block .katex-display { margin: 0; }
  #tr-body .tr-math-fallback { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--text-2); word-break: break-all; }

  /* ---------- 翻译端点设置浮层 ---------- */
  /* 阅读器在窄 iframe 里，宽度要能收缩 */
  #cfg-pop { position: fixed; z-index: 60; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px; width: min(320px, calc(100vw - 32px)); }
  #cfg-pop h3 { margin: 0; font-size: 13px; }
  #cfg-hint { font-size: 12px; color: var(--text-2); margin: 4px 0 2px; }
  #cfg-pop label { display: block; font-size: 12px; color: var(--text-2); margin: 8px 0 2px; }
  #cfg-pop input, #cfg-pop select { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; background: var(--panel); color: var(--text); }
  #cfg-model-hint, #cfg-source { font-size: 11.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
  #cfg-source:empty { display: none; }
  #cfg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  #cfg-save { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  #cfg-save:disabled { opacity: .5; cursor: default; }
  #cfg-cancel { background: none; border: none; color: var(--text-2); cursor: pointer; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; max-width: 70%; }
</style>

<script>

const ICONS = {
  translate: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',

  prev: '<path d="m15 18-6-6 6-6"/>',
  next: '<path d="m9 18 6-6-6-6"/>',

  spin: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-3.9-3.9"/>',
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',

const iconHtml = (name) => `<svg class="ic${name === 'spin' ? ' spin' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
// 静态按钮按 data-icon 注入一次；动态按钮（翻译/重翻/模式切换）在状态变化时用同一函数换图标
document.querySelectorAll('#bar [data-icon], #find-window [data-icon], #note-window [data-icon], #sel-menu [data-icon]').forEach((b) => b.insertAdjacentHTML('afterbegin', iconHtml(b.dataset.icon)));
const api = (p, opts) => fetch('/paper-reader/api' + p, opts).then(async (r) => {
  if (!r.ok) {
    // 服务端错误体有两种：{error}（参数/权限）与 {reason}（zh/generate 的未启动原因，带完整说明）
    const body = await r.json().catch(() => ({}));
    const err = new Error(body.error || body.reason || ('HTTP ' + r.status));
    err.code = body.code;   // 机器可读码（如 no-endpoint）——让调用方靠它分支，别去匹配中文文案
    err.status = r.status;
    // 划词翻译的 502 带上游状态码：客户端据此出 §3.7② 的分档文案（拒绝/限流/端点错误），

    err.upstreamStatus = body.upstreamStatus;

function toast(msg, ms = 3200) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  const p = $('pdf-path').textContent;
  if (!p) return;
  toast((await copyText(p)) ? '路径已复制' : '复制失败，路径见按钮悬停提示');

let current = null;        // { topic, name }
let zhState = { zh: false, dual: false, busy: false };
let statusMeta = ''; // openPaper 的「name · N 页」基线，翻译阶段标签褪去后恢复它
let zhVariant = null;      // null=原文 'dual'=中英对照 'zh'=纯中文（**分屏 split 也是 null**，见 C17）
// 视图模式：四个控件（中/对照/分屏）挂在同一个状态上，互斥（§4.3）。
// 'split'（模式 B）刻意让 zhVariant 保持 null —— 这样 eqHotEnabled()/公式面板文案/fitMode
// 等既有分支继续按「原文」工作，零改动。
let viewMode = 'orig';     // 'orig' | 'zh' | 'dual' | 'split'
// 每篇论文记住上次用的语言版本：伴读会话的跳转链接原地跳页不重载，
// 加上这里的恢复，「中文界面跳中文」在同篇跳转/重开/跨论文三条路径上都成立
const variantKey = (topic, name) => `dpr.variant.${topic}/${name}`;

// 阅读模式：scroll=连续滚动（默认，原行为）paged=单页翻页；每读者记忆
let pageMode = localStorage.getItem('dpr.pageMode') === 'paged' ? 'paged' : 'scroll';
// 当前页：paged 是唯一渲染依据；scroll 由 IntersectionObserver 跟随回写（模式切换/跳页共享）
let curPage = 1;

/* ================= 打开文献 ================= */
function pdfUrl(variant) {
  const q = `topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`;
  return `/paper-reader/api/pdf?${q}${variant ? '&variant=' + variant : ''}&t=${Date.now()}`;
}

async function openPaper(topic, name, opts = {}) {
  if (!name) return;
  current = { topic, name };
  // R-01/N-01：换文献的在飞译文必须**立刻**失效——必须放在本函数第一处 await 之前。
  // 原来它在三次 await（`/api/paper`、`refreshZhState`、`loadFormulas`）之后，落在那几个窗口里
  // 到达的旧响应仍会点亮气泡（t8 复审 N-01：P-A3 实测 seq 2→3 时气泡已显示上一篇译文）。
  invalidateTranslate();
  localStorage.setItem('dpr.last', JSON.stringify(current));
  curPage = opts.page || 1; // 换论文从第一页（或跳转目标页）开始；变体切换/重译不走这里，页码保持
  $('status').textContent = '加载 PDF…';
  const q = `topic=${encodeURIComponent(topic)}&name=${encodeURIComponent(name)}`;
  const meta = await api('/paper?' + q);
  statusMeta = meta.hasTranscript
    ? `${name} · ${meta.pageCount ?? '?'} 页`
    : `${name} · 未转录（提问时会自动转录）`;
  $('status').textContent = statusMeta;
  // 文件路径展示（点击复制）：独立于 #status，翻译阶段的 phase 覆写不影响它
  const pathBtn = $('pdf-path');
  pathBtn.textContent = meta.pdfPath || '';
  pathBtn.title = (meta.pdfPath || '') + '（点击复制）';
  pathBtn.style.display = meta.pdfPath ? '' : 'none';
  await refreshZhState();
  // 恢复该论文上次的视图模式（持久化复用同一个键，取值域扩到 'split'；见 §4.3）
  const saved = localStorage.getItem(variantKey(topic, name));
  viewMode = viewModeFromSaved(saved, zhState);
  if (saved && viewMode === 'orig') localStorage.setItem(variantKey(topic, name), ''); // 非空但不可用 → 回写空（防脏值）
  zhVariant = viewMode === 'zh' ? 'zh' : viewMode === 'dual' ? 'dual' : null; // split → null
  $('zh-toggle').classList.toggle('active', zhVariant !== null);
  // 译文版页宽与原文不同（对照双栏≈2×），分屏每列只有一半宽 ⇒ 都先进适宽
  if (zhVariant || viewMode === 'split') { fitMode = true; fitBtn.classList.add('active'); }
  // 公式索引（MinerU content_list）：**必须在 loadPdf 之前到货**——热区是在 paintPage 里
  // 按 eqIndex 铺的，先渲染会漏画/残留上一篇的矩形；又必须排在 zhVariant 定稿之后——
  // eqHotEnabled()/renderEqPanel() 都按 zhVariant 决定「译文视图关热区」。失败不影响打开文献。
  await loadFormulas();
  // 笔记必须在 loadPdf 之前到货：渲染完成后的重画要直接按 notes.list 铺波浪线
  await loadNotes();
  updateDlBtn();
  updateViewButtons();
  if (viewMode === 'split') {
    await openSplit(); // 内部自己拉原文 + -zh.pdf 两个文档
  } else {
    // R-02：原地换文献时**无条件**退掉分屏（幂等）——否则新论文有 -zh.pdf、而持久化视图又不是
    // split 时，refreshZhState 的回落守卫不触发，中文列会留着**上一篇**的 PDF（pdfDocZh 也不释放）。
    teardownSplit();
    await loadPdf(pdfUrl(zhVariant));
  }
  if (opts.page) jumpTo(opts.page, opts.q); // 不 await：跳转内部自带「等页面渲出来」轮询
}

/* ================= 下载/导出 ================= */
// 下载当前正在看的那个版本（原文/纯中文/中英对照）——导出译文的主要入口
function updateDlBtn() {
  const btn = $('dl-btn');
  const findBtn = $('find-open');
  const noteBtn = $('note-open');
  if (!current) {
    btn.style.display = 'none';
    if (findBtn) findBtn.style.display = 'none';
    if (noteBtn) noteBtn.style.display = 'none';
    return;
  }
  btn.style.display = '';
  if (findBtn) findBtn.style.display = '';
  if (noteBtn) noteBtn.style.display = '';
  btn.title = zhVariant === 'zh' ? '下载：纯中文版 PDF'
    : zhVariant === 'dual' ? '下载：中英对照版 PDF' : '下载：原文 PDF';
}
function downloadCurrent() {
  if (!current) return;
  // 同源请求自动带 cookie（鉴权围栏）；download 属性空值 → 文件名取 content-disposition
  const a = document.createElement('a');
  a.href = pdfUrl(zhVariant) + '&download=1';
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
$('dl-btn').onclick = downloadCurrent;

/* ================= 在文中查找（顶栏 🔍 / Ctrl+F）=================
   索引来自 pdf.js 的 getTextContent 而**不是** DOM：翻页/分屏模式 DOM 里只有当前页，
   只查 DOM 会漏掉其它页的命中。归一化口径与 highlightSnippet 一致（忽略空白、连字符、
   软连字符与大小写），论文跨行断词（dis-tributed）也能命中。
   页内高亮不给 span 加背景类（span 常常是一整行，加类还会动 textLayer 的换行与划词），
   改用 Range.getClientRects() 在 .findLayer 里画百分比盒子：精确到词、缩放后自动对齐、
   不吃鼠标事件（pointer-events:none，划词提问照旧）。 */
const FIND_MAX_HITS = 2000;   // 防御：极端查询（单个字母）不至于把面板撑爆
const FIND_WIN_KEY = 'dpr.findWin';       // 结果窗口的位置与尺寸（localStorage）
const FIND_EXPAND_KEY = 'dpr.findExpand'; // 精简/全部（1 = 全部）
const FIND_COMPACT_HITS = 30; // 精简模式列多少处
const findInputEl = $('find-input');
const findCountEl = $('find-count');
let find = { q: '', needle: '', hits: [], idx: -1, index: null, doc: null, building: false, shown: false, listStale: true, expand: false };
let findTimer = null;
let findWin = { x: null, y: null, w: 330, h: 340 };  // x/y 为 null = 还没定位过（贴 🔍 下方）
const findWinEl = $('find-window');
try { find.expand = localStorage.getItem(FIND_EXPAND_KEY) === '1'; } catch { /* 隐私模式：默认精简 */ }

/** 归一化 + 回原串索引：丢掉空白/连字符/软连字符并转小写（map[i] = 归一化串第 i 字符在原文的位置） */
function findNorm(str) {
  let nh = '';
  const map = [];
  for (let i = 0; i < str.length; i++) {
    const c = str[i].toLowerCase();
    if (/\s/.test(c) || c === '-' || c === '­') continue;
    nh += c;
    map.push(i);
  }
  return { nh, map };
}

/** 一页的文本索引：text 保留空格（给结果列表做上下文片段），nh/map 用于匹配 */
async function findPageIndex(n) {
  const page = await pdfDoc.getPage(n);
  const tc = await page.getTextContent();
  // item 之间补空格：pdf.js 把同一行的单词切成多个 item，直接拼会粘连成 "theenclave"
  const text = tc.items.map((it) => it.str || '').join(' ').replace(/\s+/g, ' ').trim();
  const { nh, map } = findNorm(text);
  return { text, nh, map };
}

async function findBuildIndex() {
  if (!pdfDoc) return;
  if (find.index && find.doc === pdfDoc) return;
  const doc = pdfDoc;
  find.doc = doc;
  find.index = new Map();
  find.building = true;
  const total = doc.numPages;
  for (let n = 1; n <= total; n++) {
    if (find.doc !== doc) return;   // 索引期间换了文档/变体：这份索引作废
    try { find.index.set(n, await findPageIndex(n)); } catch { find.index.set(n, null); }
    updateFindCount(`索引 ${n}/${total}`);
    if (n % 8 === 0) await new Promise((r) => setTimeout(r, 0));   // 让出主线程，别卡住滚动
  }
  find.building = false;
}

/** 上下文片段：命中前后各留一段，去掉首尾空白并把偏移跟着挪 */
function findSnippet(text, start, end) {
  const pad = 42;
  let a = Math.max(0, start - pad);
  let b = Math.min(text.length, end + pad);
  while (a < start && /\s/.test(text[a])) a++;
  while (b > end && /\s/.test(text[b - 1])) b--;
  return { pre: a > 0, post: b < text.length, text: text.slice(a, b), hitStart: start - a, hitEnd: end - a };
}

/** 扫全篇收集命中（按页、按出现顺序），每处带「该页内第几个」序号（高亮时要对号入座） */
function findCollect() {
  find.hits = [];
  find.idx = -1;
  const needle = find.needle;
  if (!needle || !find.index) return;
  for (const [page, e] of find.index) {
    if (!e || !e.nh) continue;
    let from = 0;
    let ord = 0;
    for (;;) {
      if (find.hits.length >= FIND_MAX_HITS) return;
      const at = e.nh.indexOf(needle, from);
      if (at < 0) break;
      const start = e.map[at];
      const end = e.map[at + needle.length - 1] + 1;
      find.hits.push({ page, ord, snippet: findSnippet(e.text, start, end) });
      ord += 1;
      from = at + Math.max(1, needle.length);
    }
  }
}

function updateFindCount(note) {
  if (!findCountEl) return;
  findCountEl.classList.remove('hit');
  if (note) { findCountEl.textContent = note; findCountEl.title = ''; return; }
  if (!find.q || !find.needle) { findCountEl.textContent = ''; findCountEl.title = ''; return; }
  if (find.building) { findCountEl.textContent = '索引…'; return; }
  if (!find.hits.length) {
    findCountEl.textContent = '无匹配';
    findCountEl.title = '没有找到这段文字。扫描件没有文本层时也搜不到';
    return;
  }
  // idx < 0 = 还没跳过（边打边搜阶段）：显示总处数，别让用户看到 "0/12"
  findCountEl.textContent = find.idx < 0 ? `${find.hits.length} 处` : `${find.idx + 1}/${find.hits.length}`;
  findCountEl.classList.add('hit');
  findCountEl.title = `共 ${find.hits.length} 处（Enter 下一处，Shift+Enter 上一处）`;
}

function findMetaText() {
  if (!find.q) return '输入关键词：Enter 跳到第一处，Shift+Enter 上一处，Esc 关闭。';
  if (!find.needle) return '';
  if (find.building && !find.hits.length) return '正在建立索引…';
  if (!find.hits.length) {
    return `没有找到「${find.q}」。如果这篇是扫描件（没有文本层）就会搜不到，可先用转录或 MinerU 解析再试。`;
  }
  const pages = new Set(find.hits.map((h) => h.page)).size;
  const capped = find.hits.length >= FIND_MAX_HITS ? `（已截断到前 ${FIND_MAX_HITS} 处）` : '';
  return `「${find.q}」共 ${find.hits.length} 处，分布在 ${pages} 页${capped}。点条目直接跳转。`;
}

/* ---------- 结果窗口：可拖动、可拖边框缩放、可精简/全部 ---------- */
function findWinSave() {
  if (!findWinEl) return;
  try {
    const r = findWinEl.getBoundingClientRect();
    localStorage.setItem(FIND_WIN_KEY, JSON.stringify({
      x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height),
    }));
  } catch { /* 隐私模式记不住：下次回到默认位置，不影响本次使用 */ }
}

function findWinLoad() {
  if (!findWinEl) return;
  try {
    const raw = JSON.parse(localStorage.getItem(FIND_WIN_KEY) || 'null');
    if (raw) {
      if (Number.isFinite(raw.w)) findWin.w = Math.max(240, Math.min(720, raw.w));
      if (Number.isFinite(raw.h)) findWin.h = Math.max(190, raw.h);
      if (Number.isFinite(raw.x) && Number.isFinite(raw.y)) { findWin.x = raw.x; findWin.y = raw.y; }
    }
  } catch { /* 坏 JSON：用默认值 */ }
}

/** 落位并夹在视口内（窗口拖动/缩放/视口变化后都走这里，保证不会拖到屏幕外找不回来） */
function findWinPlace() {
  if (!findWinEl) return;
  const w = findWin.w;
  const h = Math.min(findWin.h, Math.max(190, window.innerHeight - 40));
  let x = findWin.x;
  let y = findWin.y;
  if (x === null || y === null) {
    // 首次打开：贴在 🔍 按钮下方（用户点的那颗按钮旁边最符合直觉）；按钮没显出来就贴右上角
    const btn = $('find-open');
    const r = btn ? btn.getBoundingClientRect() : null;
    if (r && r.width) {
      x = r.right - w;
      y = r.bottom + 6;
    } else {
      x = window.innerWidth - w - 26;
      y = 64;
    }
  }
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  y = Math.max(8, Math.min(y, window.innerHeight - h - 8));
  findWinEl.style.width = w + 'px';
  findWinEl.style.height = h + 'px';
  findWinEl.style.left = Math.round(x) + 'px';
  findWinEl.style.top = Math.round(y) + 'px';
  findWin.x = Math.round(x);
  findWin.y = Math.round(y);
}

function findWinShow(on) {
  if (!findWinEl) return;
  if (!on) {
    findWinEl.classList.remove('on');
    find.shown = false;
    return;
  }
  findWinEl.classList.add('on');
  find.shown = true;
  findWinPlace();
  renderFindList();
}

/** 精简模式只列当前命中附近的一段，避免几百处命中把窗口刷成冗长清单 */
function findVisibleIdx() {
  const n = find.hits.length;
  const out = [];
  if (find.expand || n <= FIND_COMPACT_HITS) {
    for (let i = 0; i < n; i++) out.push(i);
    return out;
  }
  const center = find.idx < 0 ? 0 : find.idx;
  let start = Math.max(0, center - Math.floor(FIND_COMPACT_HITS / 2));
  if (start + FIND_COMPACT_HITS > n) start = Math.max(0, n - FIND_COMPACT_HITS);
  for (let i = start; i < start + FIND_COMPACT_HITS; i++) out.push(i);
  return out;
}

function findSetExpand(on) {
  find.expand = on;
  try { localStorage.setItem(FIND_EXPAND_KEY, on ? '1' : '0'); } catch { /* 忽略 */ }
  find.listStale = true;
  renderFindList();
}

/** 重建结果列表（只在查询/模式变化时做；跳转只切 .cur 类，不重建 DOM） */
function renderFindList() {
  const list = $('find-list');
  const meta = $('find-meta');
  const head = $('find-headcount');
  if (!list || !meta || !head) return;
  meta.textContent = findMetaText();
  head.textContent = !find.q || !find.needle ? ''
    : !find.hits.length ? '无匹配'
    : find.idx < 0 ? `${find.hits.length} 处` : `${find.idx + 1}/${find.hits.length}`;
  const expBtn = $('find-expand');
  if (expBtn) {
    expBtn.style.display = find.hits.length > FIND_COMPACT_HITS ? '' : 'none';
    // 按钮写的是「点了会变成什么」：精简时显示「全部」，全部时显示「精简」
    expBtn.textContent = find.expand ? '精简' : '全部';
    expBtn.classList.toggle('on', find.expand);
    expBtn.title = find.expand ? `当前列出全部 ${find.hits.length} 处，点击收成精简` : `当前只列 ${FIND_COMPACT_HITS} 处，点击展开全部 ${find.hits.length} 处`;
  }
  if (!find.listStale && list.childElementCount) { syncFindCurrent(); return; }
  find.listStale = false;
  list.innerHTML = '';
  if (!find.hits.length) return;
  const frag = document.createDocumentFragment();
  const shown = findVisibleIdx();
  let lastPage = 0;
  for (const i of shown) {
    const hit = find.hits[i];
    if (hit.page !== lastPage) {
      const ph = document.createElement('div');
      ph.className = 'find-page';
      ph.textContent = `第 ${hit.page} 页`;
      frag.appendChild(ph);
      lastPage = hit.page;
    }
    const s = hit.snippet;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'find-item';
    btn.dataset.i = String(i);
    if (s.pre) btn.appendChild(document.createTextNode('…'));
    btn.appendChild(document.createTextNode(s.text.slice(0, s.hitStart)));
    const mk = document.createElement('mark');
    mk.textContent = s.text.slice(s.hitStart, s.hitEnd);
    btn.appendChild(mk);
    btn.appendChild(document.createTextNode(s.text.slice(s.hitEnd)));
    if (s.post) btn.appendChild(document.createTextNode('…'));
    btn.addEventListener('click', () => { void findGoto(i); });
    frag.appendChild(btn);
  }
  if (shown.length < find.hits.length) {
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'find-item';
    more.style.textAlign = 'center';
    more.style.color = 'var(--text-2)';
    more.textContent = `还有 ${find.hits.length - shown.length} 处没有列出 · 点这里展开全部`;
    more.addEventListener('click', () => findSetExpand(true));
    frag.appendChild(more);
  }
  list.appendChild(frag);
  syncFindCurrent();
}

function syncFindCurrent() {
  const list = $('find-list');
  if (!list) return;
  let cur = null;
  list.querySelectorAll('.find-item').forEach((el) => {
    const on = Number(el.dataset.i) === find.idx;
    el.classList.toggle('cur', on);
    if (on) cur = el;
  });
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function findClearBoxes() {
  document.querySelectorAll('.findLayer').forEach((l) => l.remove());
  document.querySelectorAll('.textLayer span.find-hit').forEach((sp) => sp.classList.remove('find-hit', 'cur'));
}

/** 一页 DOM 的「拼接串 + 归一化映射 + 偏移→(文本节点, offset) 定位器」 */
function findPageHay(pageDiv) {
  const tl = pageDiv.querySelector('.textLayer');
  if (!tl) return null;
  // 用**文本节点**而不是 span：Range.setStart(node, n) 里的 n 对元素节点是「子节点序号」，
  // 对文本节点才是字符偏移。之前把字符偏移直接喂给 span，Range 要么抛错、要么落在行首，
  // getClientRects 拿不到有效矩形 → 这就是「搜到了却没有标黄」的根因。
  const nodes = [];
  const startOf = [];
  let hay = '';
  const walker = document.createTreeWalker(tl, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    const t = n.nodeValue || '';
    if (!t) continue;
    nodes.push(n);
    startOf.push(hay.length);
    hay += t;
  }
  if (!hay) return null;
  const { nh, map } = findNorm(hay);
  if (!nh) return null;
  const at = (off) => {
    let lo = 0;
    let hi = startOf.length - 1;
    let idx = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (startOf[mid] <= off) { idx = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return [nodes[idx], Math.min(off - startOf[idx], nodes[idx].nodeValue.length)];
  };
  return { nh, map, at };
}

/** 兜底高亮：Range 几何算不出来（跨节点怪例、TextLayer 结构变化）时给 span 加类。
 *  宁可粗一点，也不能出现「搜到了却看不见」。 */
function findMarkSpansFallback(tl, ord) {
  const spans = [...tl.querySelectorAll('span:not(.markedContent)')];
  let seen = 0;
  for (const sp of spans) {
    const t = sp.textContent || '';
    const { nh } = findNorm(t);
    if (!nh || !nh.includes(find.needle)) continue;
    sp.classList.add('find-hit');
    if (seen === ord) sp.classList.add('cur');
    seen += 1;
  }
  return seen > 0;
}

/** 在指定页画出该页全部命中（第 ord 处标为当前），返回当前盒子供滚动 */
function findMarkPage(page, ord) {
  findClearBoxes();
  const div = origPageNode(page);
  const tl = div && div.querySelector('.textLayer');
  if (!div || !tl || !find.needle) return null;
  const hay = findPageHay(div);
  if (!hay) return null;
  const rect = tl.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  const layer = document.createElement('div');
  layer.className = 'findLayer';
  // 必须插在 textLayer **之前**：paintPage 靠 div.firstChild/lastChild 取 canvas/textLayer，
  // 追加在后面会让 lastChild 变成高亮层 → TextLayer 挂错容器（同 paintEqLayer 的坑）
  div.insertBefore(layer, tl);
  const percent = (v, base) => (v / base * 100).toFixed(3) + '%';
  let cur = null;
  let found = 0;
  let from = 0;
  for (;;) {
    const at = hay.nh.indexOf(find.needle, from);
    if (at < 0) break;
    const start = hay.map[at];
    const end = hay.map[at + find.needle.length - 1] + 1;
    const [nodeA, offA] = hay.at(start);
    const [nodeB, offB] = hay.at(end);
    try {
      const rng = document.createRange();
      rng.setStart(nodeA, offA);
      rng.setEnd(nodeB, offB);
      for (const r of rng.getClientRects()) {
        if (r.width < 0.6 || r.height < 0.6) continue;   // 换行点产生的退化矩形跳过
        const isCur = found === ord;
        const box = document.createElement('span');
        box.className = 'find-box' + (isCur ? ' cur' : '');
        box.style.left = percent(r.left - rect.left, rect.width);
        box.style.top = percent(r.top - rect.top, rect.height);
        box.style.width = percent(r.width, rect.width);
        box.style.height = percent(r.height, rect.height);
        layer.appendChild(box);
        if (isCur && !cur) cur = box;
      }
    } catch { /* 这一处几何算不出来：循环结束后统一兜底 */ }
    found += 1;
    from = at + Math.max(1, find.needle.length);
    if (found > 600) break;   // 单页防御
  }
  if (!layer.childElementCount) {
    layer.remove();                     // 空层留着也没用
    findMarkSpansFallback(tl, ord);     // 兜底：给命中的 span 上底色
    return null;
  }
  return cur;
}

/** 等目标页真的出现（翻页/分屏模式要先切页再等 TextLayer 铺好） */
async function findReadyPage(page) {
  if (!pdfDoc) return;
  const p = Math.max(1, Math.min(page, pdfDoc.numPages));
  if ((pageMode === 'paged' || viewMode === 'split') && curPage !== p) {
    curPage = p;
    await rerender();
    updatePager();
  }
  for (let i = 0; i < 120; i++) {
    const div = origPageNode(p);
    if (div && div.querySelector('.textLayer span')) return;
    await new Promise((r) => setTimeout(r, 50));
  }
}

async function findGoto(i) {
  if (!find.hits.length) return;
  const n = find.hits.length;
  find.idx = ((i % n) + n) % n;          // 首尾循环
  const hit = find.hits[find.idx];
  await findReadyPage(hit.page);
  if (!find.hits.length) return;
  const cur = findMarkPage(hit.page, hit.ord);
  updateFindCount();
  if (!find.listStale) syncFindCurrent();
  const target = cur || origPageNode(hit.page);
  if (target) {
    await new Promise((r) => requestAnimationFrame(r));
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/** 新的查询：清空命中 → 建索引（有缓存则秒回）→ 收集 → 渲染列表 */
async function findRun(q) {
  find.q = q;
  find.needle = findNorm(q).nh;
  find.hits = [];
  find.idx = -1;
  find.listStale = true;
  findClearBoxes();
  renderFindList();
  if (!find.needle) { updateFindCount(); return; }
  updateFindCount('索引…');
  await findBuildIndex();
  if (find.q !== q) return;              // 期间输入又变了
  findCollect();
  renderFindList();
  updateFindCount();
  // 输入框就在窗口里，所以窗口一打开就一直开着；有结果时顺手把列表滚到当前命中
  findWinShow(true);
}

/** 打开查找窗口（focus=true 时选中输入框内容，方便直接改写关键词） */
function findPanelOpen(focus) {
  if (!findWinEl) return;
  findWinShow(true);
  if (find.idx >= 0) findReapply();   // 重新打开时把上次的当前命中重新标出来，不用再跳一次
  if (focus) { findInputEl.focus(); findInputEl.select(); }
}

/** 关闭查找窗口：连页内高亮一起收掉（关键词留着，下次按 🔍 还能直接用） */
function findClose() {
  findWinShow(false);
  findClearBoxes();
}

/** 拖动窗口标题栏（指针事件：鼠标/触控板/触屏同一套） */
function findWinDrag(e) {
  if (e.button !== 0 || e.target.closest('button')) return;  // 头部按钮不触发拖动
  e.preventDefault();
  const start = { mx: e.clientX, my: e.clientY, x: findWinEl.offsetLeft, y: findWinEl.offsetTop };
  const move = (ev) => {
    findWin.x = start.x + (ev.clientX - start.mx);
    findWin.y = start.y + (ev.clientY - start.my);
    findWinPlace();
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    findWinSave();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

/** 拖边缘/右下角改大小：dir = 'se'（角）| 'e'（右边缘）| 's'（下边缘） */
function findWinResize(e, dir) {
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  const start = { mx: e.clientX, my: e.clientY, w: findWinEl.offsetWidth, h: findWinEl.offsetHeight, x: findWinEl.offsetLeft, y: findWinEl.offsetTop };
  const move = (ev) => {
    if (dir !== 's') findWin.w = Math.max(220, Math.min(window.innerWidth - 16, start.w + (ev.clientX - start.mx)));
    if (dir !== 'e') findWin.h = Math.max(150, Math.min(window.innerHeight - 24, start.h + (ev.clientY - start.my)));
    findWin.x = start.x;
    findWin.y = start.y;
    findWinPlace();
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    findWinSave();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

/** 缩放/换模式/开关分屏后 DOM 被重建：把当前命中重新画上去 */
function findReapply() {
  if (!find.shown || !find.hits.length) return;
  const hit = find.hits[find.idx];
  if (hit) findMarkPage(hit.page, hit.ord);
}

/** 换了文档（换论文/原文↔译文）：索引与命中全部作废，输入框里的词留着 */
function findReset() {
  find.index = null;
  find.doc = null;
  find.hits = [];
  find.idx = -1;
  find.needle = '';
  find.q = '';
  find.listStale = true;
  findClearBoxes();
  updateFindCount();
  renderFindList();
}

findInputEl.addEventListener('input', () => {
  clearTimeout(findTimer);
  const q = findInputEl.value.trim();
  // 边打边算（220ms 防抖）但不自动跳页：跳页留给 Enter/上下箭头，避免打字时页面乱跳
  findTimer = setTimeout(() => { void findRun(q); }, 220);
});

/* ================= 笔记（划词标注 + 可移动笔记窗口）=================
   存储：服务端 `<论文>.notes.json`（与 `.study.json` 同目录 ⇒ 跟文献走、换浏览器不丢、将来也能被伴读读到）。
   锚点：页号 + 「该页 DOM 文本层拼接串」里的字符区间。文本层的内容只由 PDF 决定（与缩放/模式无关），
        所以偏移在重渲染后仍然有效 → 每次渲染完成按偏移重建 Range → 百分比盒子（蓝色波浪线）。
   为什么不用给 span 加 text-decoration：一个选区常跨多个 span，加类会把整行都画上波浪线。
   盒子层 pointer-events:none，悬停/点击靠坐标命中测试 —— 绝不挡住划词选字。 */

/* ---------- 窗口几何：与查找窗同一套（位置尺寸记在 localStorage） ---------- */
function noteWinSave() {
  try {
    const r = noteWinEl.getBoundingClientRect();
    localStorage.setItem(NOTE_WIN_KEY, JSON.stringify({
      x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height),
    }));
  } catch { /* 隐私模式记不住：下次回到默认位置 */ }
}
function noteWinLoad() {
  if (!noteWinEl) return;
  try {
    const raw = JSON.parse(localStorage.getItem(NOTE_WIN_KEY) || 'null');
    if (raw) {
      if (Number.isFinite(raw.w)) noteWin.w = Math.max(260, Math.min(720, raw.w));
      if (Number.isFinite(raw.h)) noteWin.h = Math.max(200, raw.h);
      if (Number.isFinite(raw.x) && Number.isFinite(raw.y)) { noteWin.x = raw.x; noteWin.y = raw.y; }
    }
  } catch { /* 坏 JSON：用默认值 */ }
}
function noteWinPlace() {
  if (!noteWinEl) return;
  const w = noteWin.w;
  const h = Math.min(noteWin.h, Math.max(200, window.innerHeight - 40));

  let y = noteWin.y;

    const r = btn ? btn.getBoundingClientRect() : null;
    if (r && r.width) { x = r.right - w; y = r.bottom + 6; }
    else { x = window.innerWidth - w - 26; y = 64; }
  }
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  y = Math.max(8, Math.min(y, window.innerHeight - h - 8));
  noteWinEl.style.width = w + 'px';
  noteWinEl.style.height = h + 'px';
  noteWinEl.style.left = Math.round(x) + 'px';
  noteWinEl.style.top = Math.round(y) + 'px';
  noteWin.x = Math.round(x);
  noteWin.y = Math.round(y);
}
function noteWinDrag(e) {
  if (e.button !== 0 || e.target.closest('button')) return;
  e.preventDefault();

  window.addEventListener('pointercancel', up);
}

  const move = (ev) => {

    if (dir !== 'e') noteWin.h = Math.max(200, Math.min(window.innerHeight - 24, start.h + (ev.clientY - start.my)));

/* ---------- 读写（服务端 <论文>.notes.json） ---------- */
function notesQs() {
  return '?topic=' + encodeURIComponent(current.topic) + '&name=' + encodeURIComponent(current.name);
}
async function loadNotes() {
  notes.list = [];
  notes.editing = null;
  notes.loading = true;
  if (noteWinEl) noteWinEl.classList.remove('editing');
  noteClearLayers();
  renderNoteList();
  if (!current) { notes.loading = false; return; }
  const want = current.topic + '/' + current.name;
  try {
    const r = await api('/notes' + notesQs());
    if (!current || current.topic + '/' + current.name !== want) return;   // 期间换了文献：丢弃
    notes.list = Array.isArray(r.notes) ? r.notes : [];
  } catch { /* 笔记读不出来不影响读论文 */ }
  notes.loading = false;
  renderNoteList();
  notesReapply();
}
/** 写一条（save）或删一条（delete）；服务端返回整份笔记列表，客户端整体替换 */
async function notesPost(action, note) {
  const body = { topic: current.topic, name: current.name, action };
  if (action === 'delete') body.id = note.id;
  else body.note = note;
  const r = await api('/notes', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  notes.list = Array.isArray(r.notes) ? r.notes : notes.list;
}

/* ---------- 锚点：选区 ⇄ 字符偏移 ---------- */
/** 一页文本层的「拼接串 + 文本节点表」；at(off) 给 (文本节点, 节点内偏移)，offsetOf(node,off) 反向换算。
 *  必须用文本节点：Range.setStart(元素, n) 里的 n 是子节点序号（查找高亮踩过这个坑）。 */
function noteTextHay(pageDiv) {
  const tl = pageDiv && pageDiv.querySelector('.textLayer');
  if (!tl) return null;
  const nodes = [];
  const startOf = [];
  let hay = '';
  const walker = document.createTreeWalker(tl, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    const t = n.nodeValue || '';
    if (!t) continue;
    nodes.push(n);
    startOf.push(hay.length);
    hay += t;
  }
  if (!hay) return null;
  const at = (off) => {
    let lo = 0;
    let hi = startOf.length - 1;
    let idx = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (startOf[mid] <= off) { idx = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    const node = nodes[idx];
    return [node, Math.max(0, Math.min(off - startOf[idx], node.nodeValue.length))];
  };
  const offsetOf = (node, off) => {
    const i = nodes.indexOf(node);
    return i < 0 ? null : startOf[i] + off;
  };
  return { hay, at, offsetOf, length: hay.length };
}
/** 把当前选区换算成 `{page,start,end,doc}`；换算不出来（扫描件/跨页/结构异常）返回 null */
function noteAnchorFromSelection() {
  const sel = askSelection;
  if (!sel || !sel.range || !current) return null;
  const node = sel.range.startContainer;
  const el = node && (node.nodeType === 3 ? node.parentElement : node);
  const pageEl = el && el.closest ? el.closest('.page') : null;
  if (!pageEl) return null;
  const page = +(pageEl.dataset.page || 0) || 0;
  if (!page) return null;
  const hay = noteTextHay(pageEl);
  if (!hay) return null;
  const start = hay.offsetOf(sel.range.startContainer, sel.range.startOffset);
  const end = hay.offsetOf(sel.range.endContainer, sel.range.endOffset);
  if (start === null || end === null) return null;
  const a = Math.min(start, end);
  const b = Math.max(start, end);
  if (b - a < 1) return null;
  // 分屏时在中文列划的词，锚点算的是译文文本层的偏移 → 记下是哪一列，重画时只画回同一列
  const doc = pageEl.closest('#pdf-pages-zh') ? 'zh' : 'orig';
  return { page, start: a, end: b, doc, quote: sel.text.slice(0, 400) };
}

/* ---------- 画波浪线（蓝色，选中文字下方） ---------- */
function noteClearLayers() {
  document.querySelectorAll('.noteLayer').forEach((l) => l.remove());
  noteHideTip();
}
function notePaintPageDiv(div) {
  const tl = div && div.querySelector('.textLayer');
  const page = +(div && div.dataset && div.dataset.page) || 0;
  if (!tl || !page) return;
  const doc = div.closest && div.closest('#pdf-pages-zh') ? 'zh' : 'orig';
  const list = notes.list.filter((n) => n.anchor && n.anchor.page === page
    && n.anchor.end > n.anchor.start && (n.anchor.doc || 'orig') === doc);
  if (!list.length) return;
  const hay = noteTextHay(div);
  const rect = tl.getBoundingClientRect();
  if (!hay || !rect.width || !rect.height) return;
  // 同一页可能被重画多次（逐页渲染 + 收尾重放）：先清掉这一页旧的装饰层，避免叠出两层波浪线
  const stale = div.querySelector(':scope > .noteLayer');
  if (stale) stale.remove();
  const pct = (v, base) => (v / base * 100).toFixed(3) + '%';
  const layer = document.createElement('div');
  layer.className = 'noteLayer';
  // 与 findLayer 同理：必须插在 textLayer **之前**，否则 paintPage 的 firstChild/lastChild 会取错元素
  div.insertBefore(layer, tl);
  for (const n of list) {
    const a = Math.max(0, Math.min(n.anchor.start, hay.length - 1));
    const b = Math.max(a + 1, Math.min(n.anchor.end, hay.length));
    const [na, oa] = hay.at(a);
    const [nb, ob] = hay.at(b);
    try {
      const rng = document.createRange();
      rng.setStart(na, oa);
      rng.setEnd(nb, ob);
      for (const r of rng.getClientRects()) {
        if (r.width < 0.6 || r.height < 0.6) continue;   // 换行点产生的退化矩形
        const box = document.createElement('span');
        box.className = 'note-under';
        box.dataset.note = n.id;
        box.style.left = pct(r.left - rect.left, rect.width);
        box.style.top = pct(r.top - rect.top, rect.height);
        box.style.width = pct(r.width, rect.width);
        box.style.height = pct(r.height, rect.height);
        layer.appendChild(box);
      }
    } catch { /* 单条锚点算不出几何：跳过这条，列表里仍能看到 */ }
  }
  if (!layer.childElementCount) layer.remove();
}
/** 缩放/切模式/换文档会重建整个 DOM：重画全部波浪线 */
function notesReapply() {
  noteClearLayers();
  if (!pdfDoc || !notes.list.length) return;
  document.querySelectorAll('#pdf-pages .page, #pdf-pages-zh .page').forEach((div) => notePaintPageDiv(div));
}

/* ---------- 悬停提示 + 点击命中 ---------- */
function noteById(id) {
  return notes.list.find((n) => n.id === id) || null;
}
function noteFindAt(x, y) {

function noteFmtTime(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || Number.isNaN(d.getTime())) return '';
  const p = (v) => String(v).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderNoteList() {
  const list = $('note-list');
  const head = $('note-headcount');
  if (!list || !head) return;
  head.textContent = notes.list.length ? `${notes.list.length} 条` : '';
  list.textContent = '';
  if (!notes.list.length) {
    const empty = document.createElement('div');
    empty.id = 'note-empty';
    empty.textContent = notes.loading
      ? '正在读取笔记…'
      : '还没有笔记。选中正文里的文字 → 点「笔记」，或点标题栏的 ＋ 新建。笔记保存在这篇文献旁边（<论文>.notes.json），换浏览器也不会丢。';
    list.appendChild(empty);
    return;
  }
  // 按原文顺序列（没锚定的排最后）
  const sorted = notes.list.slice().sort((a, b) => {
    const pa = a.anchor && a.anchor.page ? a.anchor.page : 1e9;
    const pb = b.anchor && b.anchor.page ? b.anchor.page : 1e9;
    if (pa !== pb) return pa - pb;
    return ((a.anchor && a.anchor.start) || 0) - ((b.anchor && b.anchor.start) || 0);
  });
  const frag = document.createDocumentFragment();
  for (const n of sorted) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'note-item';
    btn.dataset.id = n.id;
    btn.title = n.anchor && n.anchor.page ? `跳到第 ${n.anchor.page} 页` : '这条笔记没有可定位的原文位置';
    const meta = document.createElement('span');
    meta.className = 'ni-meta';
    meta.textContent = n.anchor && n.anchor.page ? `第 ${n.anchor.page} 页` : '未定位';
    const time = document.createElement('span');
    time.className = 'ni-time';
    time.textContent = noteFmtTime(n.updated || n.created);
    meta.appendChild(time);
    const bodyEl = document.createElement('span');
    bodyEl.className = 'ni-body';
    const body = String(n.body || '').trim();
    bodyEl.textContent = body.length > 220 ? body.slice(0, 220) + '…' : body;
    btn.appendChild(meta);
    btn.appendChild(bodyEl);
    if (n.quote) {
      const q = document.createElement('span');
      q.className = 'ni-quote';
      q.textContent = '「' + String(n.quote).replace(/\s+/g, ' ') + '」';
      btn.appendChild(q);
    }
    frag.appendChild(btn);
  }
  list.appendChild(frag);
}

/** 翻译进度条（只在 busy 时出现）：宽度跟着后端 progress.overall，文字给阶段+百分比。 */
function updateZhProgress() {  const box = $('zh-prog');
  const p = zhState && zhState.busy ? zhState.progress : null;
  if (!p) { box.hidden = true; return; }
  const pct = typeof p.overall === 'number' ? Math.max(0, Math.min(100, p.overall)) : null;
  box.hidden = false;
  box.querySelector('.fill').style.width = (pct === null ? 8 : Math.max(2, pct)).toFixed(1) + '%';
  box.querySelector('.txt').textContent = pct === null
    ? `${p.label || '翻译'}…`
    : `${p.label || '翻译'} ${Math.round(pct)}%`;
  box.title = p.text || '';
}
// 别人启动的翻译（另开会话/刷新页面后进来）也要能看到进度：busy 就自动挂一个低成本轮询
let zhWatch = null;
let zhGenerating = false;
function ensureZhWatch() {
  if (zhState.busy && !zhWatch && !zhGenerating) {
    zhWatch = setInterval(() => { void refreshZhState(); }, 1200);
  } else if (!zhState.busy && zhWatch) {
    clearInterval(zhWatch); zhWatch = null;
  }
}
async function refreshZhState() {
  zhState = await api(`/zh?topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`);
  const btn = $('zh-toggle');
  btn.style.display = '';
  btn.disabled = zhState.busy;
  btn.innerHTML = iconHtml(zhState.busy ? 'spin' : 'translate'); // busy：旋转弧图标（原「译」字）
  btn.title = zhState.busy ? (zhState.phase || `翻译进行中${zhState.model ? `（${zhState.model}）` : ''}…`)
    : (zhState.zh || zhState.dual) ? '切换中文译文'
    : '还没有中文版，点击生成（babeldoc，需要几分钟）';
  // 安装/准备阶段在状态栏持续可见（轮询每 5s 刷新一次）；翻译结束后恢复论文基线信息
  const statusEl = $('status');
  if (zhState.busy && zhState.phase) {
    statusEl.textContent = zhState.phase;
    statusEl.dataset.phaseShown = '1';
  } else if (!zhState.busy && statusEl.dataset.phaseShown) {
    delete statusEl.dataset.phaseShown;
    if (statusMeta) statusEl.textContent = statusMeta;
  }
  updateZhProgress();
  ensureZhWatch();
  // 重翻按钮只在「已有译文且空闲」时出现；状态变化时顺手拆掉两击确认的待确认态
  const regen = $('zh-regen');
  const canRegen = (zhState.zh || zhState.dual) && !zhState.busy;
  regen.style.display = canRegen ? '' : 'none';
  if (!canRegen) disarmRegen();
  // 分屏激活中 -zh.pdf 没了（重翻/外部删除）→ 自动回落原文 + toast + 把持久化写回 ''（§4.2/B8）
  if (viewMode === 'split' && !zhState.zh) {
    toast('中文版不存在，已退回原文', 4000);
    await setViewMode('orig');
    return;
  }
  updateViewButtons();
}

/** 顶栏三个视图控件的状态机（§4.3）：文案/active/disabled/title 全在这一处决定。 */
function updateViewButtons() {
  const zt = $('zh-toggle'), dt = $('dual-toggle'), st = $('split-toggle');
  const hasZh = zhState.zh, hasDual = zhState.dual, hasAny = hasZh || hasDual;
  const splitOn = viewMode === 'split';
  // 「中」的语义**不变**：原文 ↔ (有 zh ? 'zh' : 'dual')；分屏时加闸（避免在 zhVariant===null
  // 的误解下误开生成流程），其余情况与改造前逐字一致。
  zt.disabled = splitOn || zhState.busy;
  zt.title = splitOn ? '分屏对照中：先关闭分屏'
    : zhState.busy ? (zhState.phase || `翻译进行中${zhState.model ? `（${zhState.model}）` : ''}…`)
    : hasAny ? '切换中文译文'
    : '还没有中文版，点击生成（babeldoc，需要几分钟）';
  zt.classList.toggle('active', zhVariant !== null);

  dt.style.display = '';   // D1（队长裁定）：按钮恒可见，无产物时 disabled + title 说明原因，
                           // 把死控件变成解释（与 §6 B1 字面一致，也与 zhonly/dualonly 两态一致）
  dt.classList.toggle('active', viewMode === 'dual');
  dt.disabled = zhState.busy || !hasDual;
  dt.title = zhState.busy ? (zhState.phase || '翻译进行中…')
    : !hasDual ? '还没有中英对照版，先用「中」生成（babeldoc，需要几分钟）'
    : viewMode === 'dual' ? '当前：中英对照（模式 A），点击回到原文'
    : '用 babeldoc 的中英对照 PDF（模式 A）';

  st.style.display = '';   // D1：同上
  st.classList.toggle('active', splitOn);
  st.disabled = zhState.busy || !hasZh;
  st.title = zhState.busy ? (zhState.phase || '翻译进行中…')
    : !hasZh ? (hasDual ? '需先生成中文版（模式 B 用 -zh.pdf 与原文并排）' : '还没有中文版，先用「中」生成（babeldoc，需要几分钟）')
    : splitOn ? '当前：分屏对照（模式 B），点击回到原文'
    : '原文与中文版并排同步滚动（模式 B）';

  // 「同步滚动」开关：与三个视图控件同一个状态机（一处决定所有按钮的可见性/文案/态）；
  // 仅分屏下可见 —— 模式 A/原文/译文只有一个滚动条，开关无意义
  updateSyncToggle();
}

$('zh-toggle').onclick = async () => {
  if (!current || zhState.busy || viewMode === 'split') return;
  if (zhState.dual || zhState.zh) {

    await setViewMode(zhVariant === null ? (zhState.zh ? 'zh' : 'dual') : 'orig');
    return;

};

/* ================= 视图模式（模式 A 对照 / 模式 B 分屏）=================
   三个控件共用 viewMode；进入任一非 orig 模式都先退出另一个（互斥）。 */

/** 持久化复用既有键：lib/client.js 的改名搬家只搬 `dpr.variant.` 前缀，新增键不会被迁移（C19）。 */
function persistViewMode() {
  localStorage.setItem(variantKey(current.topic, current.name), viewMode === 'orig' ? '' : viewMode);
}

/** 读回持久化的视图模式（§4.3 的取值表）：译文/分屏不存在时回落原文，非空不可用的值由调用方回写空。 */
function viewModeFromSaved(saved, st) {
  if (saved === 'zh' && st.zh) return 'zh';
  if (saved === 'dual' && st.dual) return 'dual';
  if (saved === 'split' && st.zh) return 'split';   // 分屏需要 -zh.pdf
  return 'orig';
}

/** 视图模式的状态机（守卫 → 赋值 → 持久化 → 三个按钮/下载按钮/公式面板）。
 *  返回 false = 守卫拦下（状态未变）。渲染留给 setViewMode，便于单测状态机（B11/B12/R4）。 */
function applyViewMode(mode) {
  if (!current) return false;
  if (mode === 'dual' && !zhState.dual) return false;   // 没有 -dual.pdf，不进（按钮已 disabled）
  if (mode === 'split' && !zhState.zh) return false;    // 没有 -zh.pdf，不进
  if (mode === 'split' && window.innerWidth < SPLIT_MIN_WIDTH) {
    toast('面板太窄，请把阅读器拉宽后再用分屏对照', 4000);
    return false;
  }
  viewMode = mode;
  zhVariant = mode === 'zh' ? 'zh' : mode === 'dual' ? 'dual' : null; // split → null（C17）
  persistViewMode();
  // 切换变体后强制适宽：译文版页宽与原文不同（对照双栏≈2×、分屏每列半宽），不重算会溢出裁切
  fitMode = true; fitBtn.classList.add('active');
  updateViewButtons();
  updateDlBtn();
  renderEqPanel(); // 译文视图要给出「没有位置信息」的说明（热区同时被 eqHotEnabled 关掉）
  return true;
}

async function setViewMode(mode) {
  if (!applyViewMode(mode)) return;
  if (mode === 'split') { await openSplit(); return; }
  teardownSplit();
  await loadPdf(pdfUrl(zhVariant));
}
