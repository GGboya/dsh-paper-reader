<!DOCTYPE html>
<html lang="zh" data-dpr-pdf="pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文伴读 · dsh-paper-reader</title>
<!-- pdf.js 6.x 本地 vendor（不再走 CDN）：3.11 的字体解析对 babeldoc 嵌入的 CID 字体会回退成黑体。
     不用 <script type="module">：module 是 defer 语义（整页解析完 + 458KB 拉取编译完才执行），
     而底部经典脚本在解析期就开跑 bootstrap()，库里有论文时先到 loadPdf，此刻 window.pdfjsLib
     还没就绪 → "pdfjsLib is not defined"。改为经典脚本里动态 import()（见 ensurePdfjs），顺序有保证。 -->
<!-- KaTeX 0.16.22 本地 vendor（数学渲染；论文伴读是**离线场景**，绝不引 CDN）。
     经典脚本：页面解析期同步设置 window.katex；缺失时渲染路径会**降级**为原始 LaTeX（见 trRenderBody）。
     体积与来源见 reader/vendor/katex.NOTICE.md。 -->
<link rel="stylesheet" href="/paper-reader/vendor/katex.min.css">
<script src="/paper-reader/vendor/katex.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #24292f;
    --text-2: #656d76; --accent: #0969da; --accent-soft: rgba(9,105,218,.12);
    --hl: rgba(255, 196, 0, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.6 -apple-system, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  /* ---------- 顶栏 ----------
     flex-wrap —— 窄列（rightbar 可拖到 ~300px）下按钮放不下时换行到第二行，
     而不是向右溢出被 iframe 裁掉（v1.3.2 前的坑：＋/适宽 被挤出可视区，用户实测） */
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; row-gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
  #bar button { font: inherit; }
  /* flex:none —— 列被拖窄时按钮不许被压缩（否则文字竖排、按钮变窄条） */
  /* inline-flex + 固定高：图标/文字统一垂直居中，按钮高度不再随各家字体字形漂移 */
  .tbtn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  .tbtn:hover { background: var(--bg); }
  .tbtn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tbtn:disabled { opacity: .45; cursor: default; }
  /* 统一 SVG 图标：stroke=currentColor，active/disabled 的变色自动继承到图标 */
  .tbtn svg.ic { width: 16px; height: 16px; flex: none; }
  .tbtn svg.spin { transform-origin: center; animation: dpr-spin 1s linear infinite; }
  @keyframes dpr-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tbtn svg.spin { animation-duration: 2.4s; } }
  #zoom-label { flex: none; min-width: 44px; text-align: center; color: var(--text-2); }
  #bar .spacer { flex: 1; }
  /* min-width:0 —— flex 项默认 min-width:auto 会拒绝收缩，空间不够时转而去挤按钮；
     让标题自己截断（已有 ellipsis），按钮才能保持原样 */
  #status { flex: 0 1 auto; min-width: 0; color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* PDF 文件路径：可点的只读文本（点击复制）。⚠️ 必须可收缩（flex:0 1 auto + min-width:0）——
     它是最长的内容项，窄列时先让位给按钮、自己截断（title 悬停始终有完整路径），
     曾经 max-width:34% + flex:none 在窄列把 ＋/适宽 挤出可视区（用户实测） */
  #pdf-path { flex: 0 1 auto; min-width: 0; max-width: 34%; padding: 0; border: none; background: none; color: var(--text-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #pdf-path:hover { color: var(--accent); }
  /* 窄列（<560px）：版本号让位——它只是排障辅助信息 */
  @media (max-width: 560px) { #ver { display: none; } }

  /* ---------- PDF 区 ---------- */
  /* #split-wrap 是分屏（模式 B）的两列行容器：非分屏时只有原文列，行为与改造前一致。
     #pdf-pane 从 #main 的直接子节点变成它的子节点——#main 的 flex 语义不变。 */
  #main { display: flex; flex: 1; min-height: 0; position: relative; } /* relative：公式面板绝对定位的锚 */
  #split-wrap { display: flex; flex-direction: row; gap: 8px; flex: 1; min-width: 0; }
  #pdf-pane { flex: 1 1 0; min-width: 0; overflow: auto; padding: 16px; }
  /* 中文列（仅分屏出现）：与原文列同权重、各自滚动 */
  #pdf-pane-zh { flex: 1 1 0; min-width: 0; overflow: auto; padding: 16px; display: none; }
  #split-wrap.on > #pdf-pane-zh { display: block; }
  .pane-label { display: none; position: sticky; top: -16px; z-index: 3; background: var(--bg); color: var(--text-2);
    font-size: 12px; font-weight: 600; padding: 2px 0 6px; }
  #split-wrap.on .pane-label { display: block; }
  /* safe center：页宽超过视口时退回左对齐——普通 center 会让左右同时溢出且左侧滚不到 */
  #pdf-pages { display: flex; flex-direction: column; align-items: safe center; gap: 14px; }
  #pdf-pages-zh { display: flex; flex-direction: column; align-items: safe center; gap: 14px; }
  /* 翻页模式：单页垂直居中（safe center 同理，放大后顶部仍可滚到） */
  #pdf-pages.paged, #pdf-pages-zh.paged { min-height: 100%; justify-content: safe center; gap: 0; }

  /* ---------- 翻页控件 ---------- */
  #pager { display: flex; align-items: center; gap: 4px; flex: none; }
  /* 数字居中：text-align:right 会让单页码贴右框边、左侧空一块；
     上 padding 多 1px —— 数字无下伸部，光字心本就偏高，对称内边距看起来反而偏上 */
  #page-input { width: 3.5em; padding: 4px 6px 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; font-size: 12.5px; line-height: 20px; text-align: center; }
  #page-total { flex: none; color: var(--text-2); font-size: 12px; white-space: nowrap; }
  /* 插件版本号（host 注入；未被替换时隐藏——比如旧 host 配新页面的错位场景） */
  #ver { flex: none; font-size: 10.5px; color: var(--text-2); opacity: .65; user-select: none; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .page.flash { outline: 3px solid var(--hl); outline-offset: 2px; transition: outline .15s; }
  /* textLayer CSS 必须是 pdf.js 6.x 官方规则的子集：TextLayer 只往 span 写 --font-height/--scale-x/--rotate
     变量，font-size 和 transform 全靠这里的 calc 表达式撑开；缺了的话 span 会按 body 字号渲染，
     盒子与 canvas 字形错位 —— 表现为选中高亮缺字符。--scale-factor 由 JS 在渲染时写入 */
  .textLayer {
    position: absolute; inset: 0; overflow: clip; line-height: 1; text-align: initial;
    letter-spacing: normal; word-spacing: normal; text-size-adjust: none;
    forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 0;
    --total-scale-factor: calc(var(--scale-factor, 1) * var(--user-unit, 1));
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size, 1));
    --min-font-size-inv: calc(1 / var(--min-font-size, 1));
    --scale-round-x: 1px; --scale-round-y: 1px;
  }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; user-select: text; }
  .textLayer > :not(.markedContent),
  .textLayer .markedContent span:not(.markedContent) {
    z-index: 1;
    --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(22,93,255,.3); }
  .textLayer br::selection { background: transparent; }
  /* 跳转链接的片段高亮（&q= 引文定位）：常驻不淡出，用户在阅读器里任意点一下即消
     （同代码编辑器的选中高亮语义：消失由用户触发，不由计时器触发） */
  .textLayer span.dpr-hl { background: rgba(255,196,0,.45); border-radius: 2px; }
  #empty { margin: 60px auto; color: var(--text-2); text-align: center; max-width: 420px; }

  /* ---------- 公式引用（MinerU bbox 热区 + 列表面板）----------
     契约 §1.3/§1.4：热区**不用** pointer-events:auto 的覆盖层——那会夺走 textLayer 的
     mousedown/拖拽，破坏既有划词提问。这里 .eqLayer 只负责画描边（pointer-events:none），
     命中判定在 JS 里按坐标算。 */
  .eqLayer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .eq-box { position: absolute; border-radius: 3px; }
  .eq-box.hover { outline: 1.5px dashed rgba(9,105,218,.85); background: rgba(9,105,218,.07); }
  .eq-box.hit { outline: 2px solid rgba(255,140,0,.9); background: rgba(255,196,0,.16); }
  #eq-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 88%); display: none;
    background: var(--panel); border-left: 1px solid var(--border); box-shadow: -4px 0 16px rgba(0,0,0,.08);
    overflow: auto; z-index: 3; padding: 10px 12px; }
  #eq-panel h3 { margin: 0 0 4px; font-size: 13px; }
  #eq-meta { font-size: 11.5px; color: var(--text-2); margin-bottom: 6px; line-height: 1.5; }
  .eq-page { margin: 10px 0 2px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .eq-item { display: block; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); padding: 6px 8px; margin: 4px 0; cursor: pointer; font: inherit; }
  .eq-item:hover { border-color: var(--accent); }
  .eq-item code { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
    white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .eq-item .eq-tag { font-size: 11px; color: var(--text-2); }
  #eq-note { font-size: 12px; color: var(--text-2); line-height: 1.6; }
  #eq-transcribe { margin-top: 8px; }
  #eq-toggle.muted { opacity: .55; }
  #ask-copy { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-2); cursor: pointer; margin-right: auto; }

  /* ---------- 选中即问浮层 ---------- */
  #ask-scope-row { display: flex; align-items: center; gap: 6px; margin: 2px 0 4px; font-size: 12px; color: var(--text-2); }
  #ask-scope-row select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); max-width: 60%; }
  #ask-scope-hint { opacity: .75; font-size: 11px; }
  #cfg-pop hr { border: none; border-top: 1px solid var(--border); margin: 12px 0 8px; }
  #cfg-theme-hint { font-size: 11.5px; color: var(--text-2); line-height: 1.5; margin-top: 4px; }
  #ask-scope-row { display: flex; align-items: center; gap: 6px; margin: 2px 0 4px; font-size: 12px; color: var(--text-2); }
  #ask-scope-row select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); max-width: 60%; }
  #ask-scope-hint { opacity: .75; font-size: 11px; }
  #cfg-pop hr { border: none; border-top: 1px solid var(--border); margin: 12px 0 8px; }
  #cfg-theme-hint { font-size: 11.5px; color: var(--text-2); line-height: 1.5; margin-top: 4px; }
  #ask-pop { position: fixed; z-index: 50; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px; width: 320px; }
  #ask-quote { font-size: 12px; color: var(--text-2); max-height: 64px; overflow: hidden; margin-bottom: 8px; border-left: 3px solid var(--accent-soft); padding-left: 8px; }
  #ask-input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; resize: none; }
  #ask-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #ask-send { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  #ask-send:disabled { opacity: .5; cursor: default; }
  #ask-cancel { background: none; border: none; color: var(--text-2); cursor: pointer; }
  /* 「译」动作按钮（加法：只在原文视图的纯文字选区出现，见 showAskPop） */
  #ask-translate { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--accent); cursor: pointer; }

  /* ---------- 划词译文气泡 ----------
     用户明确要求：**只显示译文**，不做「插入会话」「复制」按钮 ⇒ 气泡内部零 button 元素。
     提示（诚实降级文案）走独立的 #tr-note，绝不混进 #tr-body。 */
  #tr-pop { position: fixed; z-index: 50; display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px;
    width: min(360px, calc(100vw - 16px)); max-height: 45vh; overflow: auto; }
  #tr-status { font-size: 12px; color: var(--text-2); }
  #tr-status:empty { display: none; }
  #tr-body { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #tr-note { font-size: 12px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
  #tr-note:empty { display: none; }
  /* 公式段：KaTeX 渲染进我们新建的元素（.tr-math / .tr-math-block）；渲染失败时该段落回原始 LaTeX
     文本并加 .tr-math-fallback（可读可复制，绝不留白）。 */
  #tr-body .tr-math-block { margin: 6px 0; overflow-x: auto; }
  #tr-body .tr-math-block .katex-display { margin: 0; }
  #tr-body .tr-math-fallback { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--text-2); word-break: break-all; }

  /* ---------- 翻译端点设置浮层 ---------- */
  /* 阅读器在窄 iframe 里，宽度要能收缩 */
  #cfg-pop { position: fixed; z-index: 60; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px; width: min(320px, calc(100vw - 32px)); }
  #cfg-pop h3 { margin: 0; font-size: 13px; }
  #cfg-hint { font-size: 12px; color: var(--text-2); margin: 4px 0 2px; }
  #cfg-pop label { display: block; font-size: 12px; color: var(--text-2); margin: 8px 0 2px; }
  #cfg-pop input, #cfg-pop select { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; background: var(--panel); color: var(--text); }
  #cfg-model-hint, #cfg-source { font-size: 11.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
  #cfg-source:empty { display: none; }
  #cfg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  #cfg-save { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  #cfg-save:disabled { opacity: .5; cursor: default; }
  #cfg-cancel { background: none; border: none; color: var(--text-2); cursor: pointer; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; max-width: 70%; }
  /* ---------- 深色模式（方案 §A2.1；设置项 §A2.3）----------
     ⚠️ 滤镜只挂 `canvas`，**绝不挂 `.page`**：挂 .page 会连 `.eqLayer` 的热区描边与
     `.textLayer ::selection` 一起反转（热区框变怪色、选中高亮从蓝变橙），
     并可能影响命中判定所在的层叠上下文。挂 canvas 时文本层/热区层/浮层颜色一律不受影响。 */
  html[data-dpr-pdf="dark"] #pdf-pages .page > canvas,
  html[data-dpr-pdf="dark"] #pdf-pages-zh .page > canvas {
    filter: invert(1) hue-rotate(180deg)
            brightness(var(--dpr-dark-b, 0.92)) contrast(var(--dpr-dark-c, 0.95));
  }
  html[data-dpr-pdf="dark"] .page { background: #1b1b1c; box-shadow: none; }
  /* 深色下阅读器自身 UI（pdfDarkChrome）：**只覆写我们的自有变量**，绝不碰 --dsw-*（那是 dsh 的） */
  html[data-dpr-pdf="dark"][data-dpr-chrome="on"] {
    color-scheme: dark;
    --bg: #16181d; --panel: #1e2127; --border: #333a45; --text: #e6e8ec; --text-2: #9aa3b2;
    --accent: #4c9aff; --accent-soft: rgba(76,154,255,.18); --hl: rgba(255,196,0,.45);
  }
  /* 首帧防白闪（§A2.5 R15）：主题判定完成前藏住页面区。判定是 <head> 里的**同步**读属性，
     无网络、无 await ⇒ 正常路径下这个状态在首帧前就被覆盖；JS 完全不跑时阅读器本来就是空白。 */
  html[data-dpr-pdf="pending"] #pdf-pages,
  html[data-dpr-pdf="pending"] #pdf-pages-zh { visibility: hidden; }
</style>
</head>
<body>

<div id="bar">
  <span id="status">论文伴读</span>
  <button id="pdf-path" style="display:none" title="点击复制文件路径"></button>
  <button id="zh-toggle" class="tbtn" title="切换中文译文（没有译文时可生成）" style="display:none" data-icon="translate"></button>
  <button id="dual-toggle" class="tbtn" title="用 babeldoc 的中英对照 PDF（模式 A）" style="display:none" data-icon="columns">对照</button>
  <button id="split-toggle" class="tbtn" title="原文与中文版并排同步滚动（模式 B）" style="display:none" data-icon="split">分屏</button>
  <!-- 「同步滚动」开关（模式 B 的全局偏好）：分屏控件旁，只在分屏下可见（模式 A/原文/译文都没有两个滚动条）。
       状态换图标（sync / syncOff，与 mode-toggle 的 paged/scroll 同法）+ title 里 zh/en 说明状态；
       与设置面板里的同一项共用 dpr.syncScroll 键、互相同步。 -->
  <button id="sync-toggle" class="tbtn" title="同步滚动 / Sync scroll：开（两列一起滚，点击关闭）" style="display:none" data-icon="sync"></button>
  <button id="zh-regen" class="tbtn" title="重新翻译：删除现有译文，用当前端点重跑（换模型后用）" style="display:none" data-icon="regen"></button>
  <button id="dl-btn" class="tbtn" title="下载 PDF" style="display:none" data-icon="download"></button>
  <span class="spacer"></span>
  <button id="mode-toggle" class="tbtn" title="切换 滚动/翻页模式" style="display:none" data-icon="paged"></button>
  <span id="pager" style="display:none">
    <button id="page-prev" class="tbtn" title="上一页" data-icon="prev"></button>
    <input id="page-input" type="text" inputmode="numeric" title="页码，回车跳转">
    <span id="page-total">/ ?</span>
    <button id="page-next" class="tbtn" title="下一页" data-icon="next"></button>
  </span>
  <button id="cfg-open" class="tbtn" title="翻译端点设置" data-icon="settings"></button>
  <button id="zoom-out" class="tbtn" title="缩小" data-icon="minus"></button>
  <span id="zoom-label">100%</span>
  <button id="zoom-in" class="tbtn" title="放大" data-icon="plus"></button>
  <button id="zoom-fit" class="tbtn">适宽</button>
  <button id="theme-toggle" class="tbtn" title="PDF 深色模式：跟随 dsh 主题（点击切换 关/跟随/强制深色）">A</button>
  <button id="scope-chip" class="tbtn" title="提问范围：本篇（点击切换 本篇/所在专题含子专题）">范围：本篇</button>
  <button id="eq-toggle" class="tbtn" title="公式引用（MinerU LaTeX）" data-icon="sigma">公式</button>
  <span id="ver" title="插件版本">__DPR_VERSION__</span>
</div>

<div id="main">
  <div id="split-wrap">
    <div id="pdf-pane">
      <div id="pane-label" class="pane-label">原文</div>

<script>
'use strict';
/* 深色首帧判定（方案 §A2.2 的四级降级链 + §A2.5「朝亮色回退」）——必须在首帧**之前**同步完成，
   否则会出现「先白后黑」的白闪（Firefox/pdf.js #18680 同款公开案例）。放在模块脚本最前面：
   解析期同步执行、早于首帧，且**不新增第二个 <script> 块**（test/reader-script.mjs 的提取约定）。
   ① 宿主 body[data-ds-dark-theme] ② 宿主 html[data-ds-theme-source] ③ 自身 prefers-color-scheme
   ④ 以上全失败 ⇒ **判亮色**（宁可该黑没黑，绝不误黑）；任何异常同样朝亮色回退，绝不冒泡。 */
var __dprDarkMq = null;   // 复用的 (prefers-color-scheme: dark) MediaQueryList（只建一个，见下）
(function firstFrameTheme() {
  var mode = 'light';
  try { if (!__dprDarkMq && window.matchMedia) __dprDarkMq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { /* 无 matchMedia：走降级链下一级 */ }
  try {
    var pref = 'follow';
    try { pref = localStorage.getItem('dpr.pdfTheme') || 'follow'; } catch (e) { pref = 'follow'; }
    if (pref === 'dark') mode = 'dark';
    else if (pref === 'off' || pref === 'light') mode = 'light';
    else {
      var d = null;
      try { d = window.parent && window.parent !== window ? window.parent.document : null; } catch (e) { d = null; }
      var src = null;
      try { src = d && d.documentElement ? d.documentElement.getAttribute('data-ds-theme-source') : null; } catch (e) { src = null; }
      if (d && d.body && d.body.hasAttribute && d.body.hasAttribute('data-ds-dark-theme')) mode = 'dark';
      else if (src === 'dark') mode = 'dark';
      else if (src === 'light') mode = 'light';
      else if (__dprDarkMq && __dprDarkMq.matches) mode = 'dark';
    }
  } catch (e) { mode = 'light'; }
  try { if (document.documentElement && document.documentElement.setAttribute) document.documentElement.setAttribute('data-dpr-pdf', mode); } catch (e) { /* DOM 异常：保持 pending，不影响其余功能 */ }
})();
/* ================= 基础 ================= */
const $ = (id) => document.getElementById(id);
/* 顶栏图标：统一的 24×24 描边图标集（stroke=currentColor，active/disabled 变色自动跟随按钮）。
   曾经混用 Unicode 字符（↻/⤓/▣/⚙/＋…）——各自渲染自不同字体，粗细、大小、基线互不一致。 */
const ICONS = {
  translate: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
  regen: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  paged: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  scroll: '<path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  prev: '<path d="m15 18-6-6 6-6"/>',
  next: '<path d="m9 18 6-6-6-6"/>',
  settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  sigma: '<path d="M18 7V5H6l6 7-6 7h12v-2"/>',
  columns: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/>',
  split: '<rect width="8" height="18" x="3" y="3" rx="2"/><rect width="8" height="18" x="13" y="3" rx="2"/>',
  sync: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  syncOff: '<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/><line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/><line x1="16" x2="16" y1="19" y2="22"/><line x1="19" x2="22" y1="16" y2="16"/>',
  spin: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
};
const iconHtml = (name) => `<svg class="ic${name === 'spin' ? ' spin' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
// 静态按钮按 data-icon 注入一次；动态按钮（翻译/重翻/模式切换）在状态变化时用同一函数换图标
document.querySelectorAll('#bar [data-icon]').forEach((b) => b.insertAdjacentHTML('afterbegin', iconHtml(b.dataset.icon)));
const api = (p, opts) => fetch('/paper-reader/api' + p, opts).then(async (r) => {
  if (!r.ok) {
    // 服务端错误体有两种：{error}（参数/权限）与 {reason}（zh/generate 的未启动原因，带完整说明）
    const body = await r.json().catch(() => ({}));
    const err = new Error(body.error || body.reason || ('HTTP ' + r.status));
    err.code = body.code;   // 机器可读码（如 no-endpoint）——让调用方靠它分支，别去匹配中文文案
    err.status = r.status;
    // 划词翻译的 502 带上游状态码：客户端据此出 §3.7② 的分档文案（拒绝/限流/端点错误），
    // 而不是去 match 服务端的自由文案。
    err.upstreamStatus = body.upstreamStatus;
    throw err;
  }
  return r.json();
});
function toast(msg, ms = 3200) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ================= 深色模式（方案 §A2）=================
   路线：canvas 上打 CSS 滤镜 `invert(1) hue-rotate(180deg)` + 亮度/对比档（实测不破坏几何/选区/热区，
   见 §A2.1 与 .probe/darkmode-subtopic/e-filter-mechanics-probe.mjs）。
   主题来源（四级降级链，§A2.2）：① 宿主 body[data-ds-dark-theme] ② 宿主 html[data-ds-theme-source]
   ③ 自身 prefers-color-scheme ④ 全失败 ⇒ **亮色**（宁可该黑没黑，绝不误黑）。
   配置是**服务端唯一一份**（/api/theme/config），阅读器只做镜像（localStorage）+ 跨文档同步。 */
const DARK_STRENGTHS = [[1, 1], [0.92, 0.95], [0.85, 0.9], [0.8, 0.85]];
const THEME_PREF_KEY = 'dpr.pdfTheme';
const THEME_MIRROR_KEY = 'dpr.pdfThemeCfg';
let dprTheme = { mode: 'follow', strength: 1, chrome: true, curve: { brightness: 0.92, contrast: 0.95 } };

/** 宿主（dsh）当前的亮暗：读不到一律返回 null（跨源/沙箱/未写入 ⇒ 交下一级降级）。 */
function hostThemeSource() {
  let d = null;
  try { d = window.parent !== window ? window.parent.document : null; } catch (e) { return null; }
  if (!d) return null;
  try {
    if (d.body && d.body.hasAttribute && d.body.hasAttribute('data-ds-dark-theme')) return 'dark';
  } catch (e) { /* 继续下一级 */ }
  try {
    const src = d.documentElement && d.documentElement.getAttribute('data-ds-theme-source');
    if (src === 'dark' || src === 'light') return src;
  } catch (e) { /* 继续下一级 */ }
  return null;
}

/** 生效的 PDF 亮暗（配置优先，follow 才探测宿主）。 */
function effectivePdfTheme() {
  const pref = dprTheme.mode;
  if (pref === 'dark') return 'dark';
  if (pref === 'off' || pref === 'light') return 'light';
  const host = hostThemeSource();
  if (host) return host;
  if (__dprDarkMq && __dprDarkMq.matches) return 'dark';
  return 'light';
}

function applyPdfTheme() {
  const mode = effectivePdfTheme();
  try {
    const root = document.documentElement;
    if (root) {
      if (typeof root.setAttribute === 'function') {
        root.setAttribute('data-dpr-pdf', mode);
        root.setAttribute('data-dpr-chrome', dprTheme.chrome ? 'on' : 'off');
      }
      if (root.style && typeof root.style.setProperty === 'function') {
        root.style.setProperty('--dpr-dark-b', String(dprTheme.curve.brightness));
        root.style.setProperty('--dpr-dark-c', String(dprTheme.curve.contrast));
      }
    }
  } catch (e) { /* DOM 不可用（测试桩/极端宿主）：只跳过视觉属性写入 */ }
  const btn = $('theme-toggle');
  if (btn) {
    btn.classList.toggle('active', mode === 'dark');
    const src = dprTheme.mode === 'follow' ? `跟随 dsh（当前 ${mode === 'dark' ? '深色' : '浅色'}）` : dprTheme.mode === 'off' ? '关闭' : `强制${dprTheme.mode === 'dark' ? '深色' : '浅色'}`;
    btn.title = `PDF 深色模式：${src}（点击切换 关/跟随/强制深色）`;
  }
}

/** 本地镜像：让 <head> 的首帧判定（无网络）拿到上一次的偏好。 */
function mirrorTheme() {
  try {
    localStorage.setItem(THEME_PREF_KEY, dprTheme.mode);
    localStorage.setItem(THEME_MIRROR_KEY, JSON.stringify({ mode: dprTheme.mode, strength: dprTheme.strength, chrome: dprTheme.chrome, curve: dprTheme.curve }));
  } catch (e) { /* 无痕模式等：镜像失败不影响本次会话 */ }
}

function setThemeLocal(cfg) {
  if (cfg.mode) dprTheme.mode = cfg.mode;
  if (typeof cfg.strength === 'number') dprTheme.strength = cfg.strength;
  if (typeof cfg.chrome === 'boolean') dprTheme.chrome = cfg.chrome;
  if (cfg.curve) dprTheme.curve = { brightness: cfg.curve.brightness, contrast: cfg.curve.contrast };
  else dprTheme.curve = { brightness: DARK_STRENGTHS[dprTheme.strength][0], contrast: DARK_STRENGTHS[dprTheme.strength][1] };
  mirrorTheme();
  applyPdfTheme();
  syncThemeControls();
}

function syncThemeControls() {
  const m = $('cfg-theme-mode'); if (m) m.value = dprTheme.mode;
  const st = $('cfg-theme-strength'); if (st) st.value = String(dprTheme.strength);
  const ch = $('cfg-theme-chrome'); if (ch) ch.checked = dprTheme.chrome;
  const chip = $('scope-chip'); if (chip) chip.textContent = '范围：' + (askScopeMode() === 'topic' ? '所在专题' : '本篇');
}

/** 写后端（两处 UI 共用同一个配置；失败只 toast，不回滚本地显示——以服务端为准的语义靠下次拉取纠正）。 */
async function saveTheme(patch) {
  try {
    const r = await api('/theme/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch) });
    setThemeLocal({ mode: r.pdfTheme, strength: r.pdfDarkStrength, chrome: r.pdfDarkChrome, curve: r.curve });
  } catch (e) { toast('深色设置保存失败：' + e.message, 5000); }
}

async function loadThemeConfig() {
  try {
    const r = await api('/theme/config');
    setThemeLocal({ mode: r.pdfTheme, strength: r.pdfDarkStrength, chrome: r.pdfDarkChrome, curve: r.curve });
  } catch (e) {
    // 服务端不可用：用镜像（没有镜像就按 follow 探测宿主）——降级，不让深色能力整体失灵
    try {
      const mir = JSON.parse(localStorage.getItem(THEME_MIRROR_KEY) || 'null');
      if (mir && mir.mode) setThemeLocal(mir);
    } catch (e2) { applyPdfTheme(); }
  }
}

// 先用镜像+宿主探测立即上色（首帧就有正确属性），配置到货后再校正
(function initThemeFromMirror() {
  try {
    const mir = JSON.parse(localStorage.getItem(THEME_MIRROR_KEY) || 'null');
    if (mir && mir.mode) { dprTheme = { ...dprTheme, ...mir }; }
    else { const p = localStorage.getItem(THEME_PREF_KEY); if (p) dprTheme.mode = p; }
  } catch (e) { /* 忽略损坏镜像 */ }
  try { applyPdfTheme() } catch (e) { /* 视觉增强失败绝不影响阅读 */ }
})();

// 宿主主题变化（dsh 切主题）→ 立刻重算；同一文档内只需挂一次 MutationObserver
(function watchHostTheme() {
  let d = null;
  try { d = window.parent !== window ? window.parent.document : null; } catch (e) { d = null; }
  if (!d || typeof MutationObserver !== 'function') return;
  try {
    const ob = new MutationObserver(() => applyPdfTheme());
    ob.observe(d.body || d.documentElement, { attributes: true, attributeFilter: ['data-ds-dark-theme', 'data-ds-theme-source'] });
    if (d.documentElement) ob.observe(d.documentElement, { attributes: true, attributeFilter: ['data-ds-dark-theme', 'data-ds-theme-source'] });
  } catch (e) { /* 拿不到宿主文档：降级链照常工作 */ }
})();

// 跨文档同步：**不在这里另挂 storage 监听**——全脚本只允许一个 `window storage` 监听
// （结构性红线，见 test/selection-translate.test.mjs G8：多处监听会回声/双写打架）。
// 主题镜像的 storage 分支合并在那个唯一入口里按 key 分派（见文件后半的 storage 监听）。
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (!d || d.type !== 'dpr:theme' || typeof d !== 'object') return;
  setThemeLocal({ mode: d.pdfTheme, strength: d.pdfDarkStrength, chrome: d.pdfDarkChrome, curve: d.curve });
});

$('theme-toggle').onclick = async () => {
  // 一键切：关 → 跟随 → 强制深色 → 关（用户在阅读器里最常做的就是「太刺眼 / 恢复了」两件事）
  const next = dprTheme.mode === 'off' ? 'follow' : dprTheme.mode === 'follow' ? 'dark' : 'off';
  await saveTheme({ pdfTheme: next });
  toast(`PDF 深色模式：${next === 'off' ? '关闭' : next === 'follow' ? '跟随 dsh 主题' : '强制深色'}`);
};

$('cfg-theme-mode').onchange = () => saveTheme({ pdfTheme: $('cfg-theme-mode').value });
$('cfg-theme-strength').onchange = () => saveTheme({ pdfDarkStrength: +$('cfg-theme-strength').value, pdfDarkAdvanced: null });
$('cfg-theme-chrome').onchange = () => saveTheme({ pdfDarkChrome: $('cfg-theme-chrome').checked });

/* ================= 提问范围（方案 §B3.3）=================
   默认 = **当前论文**（改造前行为，零回归）；「所在专题」= 该专题及其整棵子树。
   只给该范围的目录内容由**服务端**装配，客户端只传 scope。 */
function askScopeKey() { return current ? `dpr.askScope.${current.topic}/${current.name}` : 'dpr.askScope'; }
function askScopeMode() {
  try { return localStorage.getItem(askScopeKey()) === 'topic' ? 'topic' : 'paper'; } catch (e) { return 'paper'; }
}
function setAskScopeMode(mode) {
  try { localStorage.setItem(askScopeKey(), mode); } catch (e) { /* 忽略 */ }
  const sel = $('ask-scope'); if (sel) sel.value = mode;
  syncThemeControls();
}
$('scope-chip').onclick = () => setAskScopeMode(askScopeMode() === 'topic' ? 'paper' : 'topic');
$('ask-scope').onchange = () => setAskScopeMode($('ask-scope').value);

// 路径复制：与「复制 LaTeX」共用同一个 copyText（剪贴板写入只有一处实现，见文件末尾定义）
$('pdf-path').onclick = async () => {
  const p = $('pdf-path').textContent;
  if (!p) return;
  toast((await copyText(p)) ? '路径已复制' : '复制失败，路径见按钮悬停提示');
};

let current = null;        // { topic, name }
let zhState = { zh: false, dual: false, busy: false };
let statusMeta = ''; // openPaper 的「name · N 页」基线，翻译阶段标签褪去后恢复它
let zhVariant = null;      // null=原文 'dual'=中英对照 'zh'=纯中文（**分屏 split 也是 null**，见 C17）
// 视图模式：四个控件（中/对照/分屏）挂在同一个状态上，互斥（§4.3）。
// 'split'（模式 B）刻意让 zhVariant 保持 null —— 这样 eqHotEnabled()/公式面板文案/fitMode
// 等既有分支继续按「原文」工作，零改动。
let viewMode = 'orig';     // 'orig' | 'zh' | 'dual' | 'split'
// 每篇论文记住上次用的语言版本：伴读会话的跳转链接原地跳页不重载，
// 加上这里的恢复，「中文界面跳中文」在同篇跳转/重开/跨论文三条路径上都成立
const variantKey = (topic, name) => `dpr.variant.${topic}/${name}`;

// 阅读模式：scroll=连续滚动（默认，原行为）paged=单页翻页；每读者记忆
let pageMode = localStorage.getItem('dpr.pageMode') === 'paged' ? 'paged' : 'scroll';
// 当前页：paged 是唯一渲染依据；scroll 由 IntersectionObserver 跟随回写（模式切换/跳页共享）
let curPage = 1;

/* ================= 打开文献 ================= */
function pdfUrl(variant) {
  const q = `topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`;
  return `/paper-reader/api/pdf?${q}${variant ? '&variant=' + variant : ''}&t=${Date.now()}`;
}

async function openPaper(topic, name, opts = {}) {
  if (!name) return;
  current = { topic, name };
  // R-01/N-01：换文献的在飞译文必须**立刻**失效——必须放在本函数第一处 await 之前。
  // 原来它在三次 await（`/api/paper`、`refreshZhState`、`loadFormulas`）之后，落在那几个窗口里
  // 到达的旧响应仍会点亮气泡（t8 复审 N-01：P-A3 实测 seq 2→3 时气泡已显示上一篇译文）。
  invalidateTranslate();
  localStorage.setItem('dpr.last', JSON.stringify(current));
  curPage = opts.page || 1; // 换论文从第一页（或跳转目标页）开始；变体切换/重译不走这里，页码保持
  $('status').textContent = '加载 PDF…';
  const q = `topic=${encodeURIComponent(topic)}&name=${encodeURIComponent(name)}`;
  const meta = await api('/paper?' + q);
  statusMeta = meta.hasTranscript
    ? `${name} · ${meta.pageCount ?? '?'} 页`
    : `${name} · 未转录（提问时会自动转录）`;
  $('status').textContent = statusMeta;
  // 文件路径展示（点击复制）：独立于 #status，翻译阶段的 phase 覆写不影响它
  const pathBtn = $('pdf-path');
  pathBtn.textContent = meta.pdfPath || '';
  pathBtn.title = (meta.pdfPath || '') + '（点击复制）';
  pathBtn.style.display = meta.pdfPath ? '' : 'none';
  setAskScopeMode(askScopeMode());
  await refreshZhState();
  // 恢复该论文上次的视图模式（持久化复用同一个键，取值域扩到 'split'；见 §4.3）
  const saved = localStorage.getItem(variantKey(topic, name));
  viewMode = viewModeFromSaved(saved, zhState);
  if (saved && viewMode === 'orig') localStorage.setItem(variantKey(topic, name), ''); // 非空但不可用 → 回写空（防脏值）
  zhVariant = viewMode === 'zh' ? 'zh' : viewMode === 'dual' ? 'dual' : null; // split → null
  $('zh-toggle').classList.toggle('active', zhVariant !== null);
  // 译文版页宽与原文不同（对照双栏≈2×），分屏每列只有一半宽 ⇒ 都先进适宽
  if (zhVariant || viewMode === 'split') { fitMode = true; fitBtn.classList.add('active'); }
  // 公式索引（MinerU content_list）：**必须在 loadPdf 之前到货**——热区是在 paintPage 里
  // 按 eqIndex 铺的，先渲染会漏画/残留上一篇的矩形；又必须排在 zhVariant 定稿之后——
  // eqHotEnabled()/renderEqPanel() 都按 zhVariant 决定「译文视图关热区」。失败不影响打开文献。
  await loadFormulas();
  updateDlBtn();
  updateViewButtons();
  if (viewMode === 'split') {
    await openSplit(); // 内部自己拉原文 + -zh.pdf 两个文档
  } else {
    // R-02：原地换文献时**无条件**退掉分屏（幂等）——否则新论文有 -zh.pdf、而持久化视图又不是
    // split 时，refreshZhState 的回落守卫不触发，中文列会留着**上一篇**的 PDF（pdfDocZh 也不释放）。
    teardownSplit();
    await loadPdf(pdfUrl(zhVariant));
  }
  if (opts.page) jumpTo(opts.page, opts.q); // 不 await：跳转内部自带「等页面渲出来」轮询
}

/* ================= 下载/导出 ================= */
// 下载当前正在看的那个版本（原文/纯中文/中英对照）——导出译文的主要入口
function updateDlBtn() {
  const btn = $('dl-btn');
  if (!current) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.title = zhVariant === 'zh' ? '下载：纯中文版 PDF'
    : zhVariant === 'dual' ? '下载：中英对照版 PDF' : '下载：原文 PDF';
}
function downloadCurrent() {
  if (!current) return;
  // 同源请求自动带 cookie（鉴权围栏）；download 属性空值 → 文件名取 content-disposition
  const a = document.createElement('a');
  a.href = pdfUrl(zhVariant) + '&download=1';
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
$('dl-btn').onclick = downloadCurrent;

/* ================= 中英切换 ================= */
async function refreshZhState() {
  zhState = await api(`/zh?topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`);
  const btn = $('zh-toggle');
  btn.style.display = '';
  btn.disabled = zhState.busy;
  btn.innerHTML = iconHtml(zhState.busy ? 'spin' : 'translate'); // busy：旋转弧图标（原「译」字）
  btn.title = zhState.busy ? (zhState.phase || `翻译进行中${zhState.model ? `（${zhState.model}）` : ''}…`)
    : (zhState.zh || zhState.dual) ? '切换中文译文'
    : '还没有中文版，点击生成（babeldoc，需要几分钟）';
  // 安装/准备阶段在状态栏持续可见（轮询每 5s 刷新一次）；翻译结束后恢复论文基线信息
  const statusEl = $('status');
  if (zhState.busy && zhState.phase) {
    statusEl.textContent = zhState.phase;
    statusEl.dataset.phaseShown = '1';
  } else if (!zhState.busy && statusEl.dataset.phaseShown) {
    delete statusEl.dataset.phaseShown;
    if (statusMeta) statusEl.textContent = statusMeta;
  }
  // 重翻按钮只在「已有译文且空闲」时出现；状态变化时顺手拆掉两击确认的待确认态
  const regen = $('zh-regen');
  const canRegen = (zhState.zh || zhState.dual) && !zhState.busy;
  regen.style.display = canRegen ? '' : 'none';
  if (!canRegen) disarmRegen();
  // 分屏激活中 -zh.pdf 没了（重翻/外部删除）→ 自动回落原文 + toast + 把持久化写回 ''（§4.2/B8）
  if (viewMode === 'split' && !zhState.zh) {
    toast('中文版不存在，已退回原文', 4000);
    await setViewMode('orig');
    return;
  }
  updateViewButtons();
}

/** 顶栏三个视图控件的状态机（§4.3）：文案/active/disabled/title 全在这一处决定。 */
function updateViewButtons() {
  const zt = $('zh-toggle'), dt = $('dual-toggle'), st = $('split-toggle');
  const hasZh = zhState.zh, hasDual = zhState.dual, hasAny = hasZh || hasDual;
  const splitOn = viewMode === 'split';
  // 「中」的语义**不变**：原文 ↔ (有 zh ? 'zh' : 'dual')；分屏时加闸（避免在 zhVariant===null
  // 的误解下误开生成流程），其余情况与改造前逐字一致。
  zt.disabled = splitOn || zhState.busy;
  zt.title = splitOn ? '分屏对照中：先关闭分屏'
    : zhState.busy ? (zhState.phase || `翻译进行中${zhState.model ? `（${zhState.model}）` : ''}…`)
    : hasAny ? '切换中文译文'
    : '还没有中文版，点击生成（babeldoc，需要几分钟）';
  zt.classList.toggle('active', zhVariant !== null);

  dt.style.display = '';   // D1（队长裁定）：按钮恒可见，无产物时 disabled + title 说明原因，
                           // 把死控件变成解释（与 §6 B1 字面一致，也与 zhonly/dualonly 两态一致）
  dt.classList.toggle('active', viewMode === 'dual');
  dt.disabled = zhState.busy || !hasDual;
  dt.title = zhState.busy ? (zhState.phase || '翻译进行中…')
    : !hasDual ? '还没有中英对照版，先用「中」生成（babeldoc，需要几分钟）'
    : viewMode === 'dual' ? '当前：中英对照（模式 A），点击回到原文'
    : '用 babeldoc 的中英对照 PDF（模式 A）';

  st.style.display = '';   // D1：同上
  st.classList.toggle('active', splitOn);
  st.disabled = zhState.busy || !hasZh;
  st.title = zhState.busy ? (zhState.phase || '翻译进行中…')
    : !hasZh ? (hasDual ? '需先生成中文版（模式 B 用 -zh.pdf 与原文并排）' : '还没有中文版，先用「中」生成（babeldoc，需要几分钟）')
    : splitOn ? '当前：分屏对照（模式 B），点击回到原文'
    : '原文与中文版并排同步滚动（模式 B）';

  // 「同步滚动」开关：与三个视图控件同一个状态机（一处决定所有按钮的可见性/文案/态）；
  // 仅分屏下可见 —— 模式 A/原文/译文只有一个滚动条，开关无意义
  updateSyncToggle();
}

$('zh-toggle').onclick = async () => {
  if (!current || zhState.busy || viewMode === 'split') return;
  if (zhState.dual || zhState.zh) {
    // 两态切换：原文 ↔ 纯中文；只存在对照版时退到对照（既有语义一字不动）
    await setViewMode(zhVariant === null ? (zhState.zh ? 'zh' : 'dual') : 'orig');
    return;
  }
  await startGenerate(false);
};

/* ================= 视图模式（模式 A 对照 / 模式 B 分屏）=================
   三个控件共用 viewMode；进入任一非 orig 模式都先退出另一个（互斥）。 */

/** 持久化复用既有键：lib/client.js 的改名搬家只搬 `dpr.variant.` 前缀，新增键不会被迁移（C19）。 */
function persistViewMode() {
  localStorage.setItem(variantKey(current.topic, current.name), viewMode === 'orig' ? '' : viewMode);
}

/** 读回持久化的视图模式（§4.3 的取值表）：译文/分屏不存在时回落原文，非空不可用的值由调用方回写空。 */
function viewModeFromSaved(saved, st) {
  if (saved === 'zh' && st.zh) return 'zh';
  if (saved === 'dual' && st.dual) return 'dual';
  if (saved === 'split' && st.zh) return 'split';   // 分屏需要 -zh.pdf
  return 'orig';
}

/** 视图模式的状态机（守卫 → 赋值 → 持久化 → 三个按钮/下载按钮/公式面板）。
 *  返回 false = 守卫拦下（状态未变）。渲染留给 setViewMode，便于单测状态机（B11/B12/R4）。 */
function applyViewMode(mode) {
  if (!current) return false;
  if (mode === 'dual' && !zhState.dual) return false;   // 没有 -dual.pdf，不进（按钮已 disabled）
  if (mode === 'split' && !zhState.zh) return false;    // 没有 -zh.pdf，不进
  if (mode === 'split' && window.innerWidth < SPLIT_MIN_WIDTH) {
    toast('面板太窄，请把阅读器拉宽后再用分屏对照', 4000);
    return false;
  }
  viewMode = mode;
  zhVariant = mode === 'zh' ? 'zh' : mode === 'dual' ? 'dual' : null; // split → null（C17）
  persistViewMode();
  // 切换变体后强制适宽：译文版页宽与原文不同（对照双栏≈2×、分屏每列半宽），不重算会溢出裁切
  fitMode = true; fitBtn.classList.add('active');
  updateViewButtons();
  updateDlBtn();
  renderEqPanel(); // 译文视图要给出「没有位置信息」的说明（热区同时被 eqHotEnabled 关掉）
  return true;
}

async function setViewMode(mode) {
  if (!applyViewMode(mode)) return;
  if (mode === 'split') { await openSplit(); return; }
  teardownSplit();
  await loadPdf(pdfUrl(zhVariant));
}
$('dual-toggle').onclick = () => setViewMode(viewMode === 'dual' ? 'orig' : 'dual');
$('split-toggle').onclick = () => setViewMode(viewMode === 'split' ? 'orig' : 'split');

// 生成/重翻共用：force=true 时服务端先删旧译文再启动；成功后轮询到完成
async function startGenerate(force) {
  try {
    const r = await api('/zh/generate', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(force ? { ...current, force: true } : current),
    });
    const m = zhState.model ? `（${zhState.model}）` : '';
    toast(r.firstRun
      ? '首次使用：正在自动安装翻译引擎（uv + Python + babeldoc，约几分钟），装完自动开始翻译…'
      : (force ? `已删除旧译文，开始重新翻译${m}…` : `开始生成中文版${m}（约几分钟）…`), 6000);
  } catch (e) {
    // 没配端点 → 直接弹配置表单；填好保存后自动回来重试（记住是不是重翻）
    if (e.code === 'no-endpoint') { cfgRetryForce = force; openCfgPop(true); return; }
    toast(e.message, 8000); return;
  }
  $('zh-toggle').disabled = true; $('zh-toggle').innerHTML = iconHtml('spin');
  $('zh-regen').style.display = 'none';
  const timer = setInterval(async () => {
    await refreshZhState();
    if (!zhState.busy) {
      clearInterval(timer);
      if (zhState.dual || zhState.zh) {
        toast('中文版已生成');
        // 重翻完成时用户可能正停在译文视图/分屏：原地刷新，而不是来回切换
        if (viewMode === 'split') await renderSplit();
        else if (zhVariant) await loadPdf(pdfUrl(zhVariant));
        else $('zh-toggle').click();
      }
      else toast('生成失败：' + (zhState.error || '未知原因'), 8000);
    }
  }, 5000);
}

/* ================= 重新翻译（重翻按钮，两击确认） ================= */
// 不用原生 confirm：阅读器跑在 dsh 桌面壳的 iframe 里，原生对话框行为不可靠。
// 第一击把按钮变成「重翻?」待确认态（3 秒有效），第二击才真删真跑。
let regenArmTimer = null;
function disarmRegen() {
  clearTimeout(regenArmTimer); regenArmTimer = null;
  const btn = $('zh-regen');
  btn.innerHTML = iconHtml('regen'); btn.classList.remove('active');
}
$('zh-regen').onclick = async () => {
  if (!current || zhState.busy) return;
  const btn = $('zh-regen');
  if (regenArmTimer) {           // 第二击：确认执行
    disarmRegen();
    await startGenerate(true);
    return;
  }
  btn.textContent = '重翻?';      // 第一击：进入待确认态
  btn.classList.add('active');
  regenArmTimer = setTimeout(disarmRegen, 3000);
};

/* ================= 翻译端点设置 ================= */
// 供应商预设（OpenAI 兼容端点，对齐 lflow 的供应商清单）：选中即回填 URL + 推荐模型。
// 一律走 Coding 套餐端点——买套餐是常态；套餐 key 走按量口会报余额不足。按量用户选「自定义」手填。
// models 仅作 datalist 建议，输入框仍可自由填写（新型号上线不用发版）。
// glm-5.x / k3 / deepseek-flash 是推理型，服务端会对这三家域名自动关 thinking（translate.ts）。
const PROVIDERS = [
  { id: 'custom',   name: '自定义（OpenAI 兼容）', baseUrl: '', models: [] },
  { id: 'deepseek', name: 'DeepSeek',  baseUrl: 'https://api.deepseek.com',                     models: ['deepseek-v4-pro', 'deepseek-flash'] },
  { id: 'glm',      name: '智谱 GLM',   baseUrl: 'https://open.bigmodel.cn/api/coding/paas/v4', models: ['glm-5.3-flash', 'glm-5.3', 'glm-4.6'] },
  { id: 'kimi',     name: 'Kimi',      baseUrl: 'https://api.kimi.com/coding/v1',              models: ['k3'] },
];
const normUrl = (u) => (u || '').trim().replace(/\/+$/, '');
// 按 baseUrl 反查预设（打开表单时回显选中项）；查不到就是 custom
const providerOf = (baseUrl) => PROVIDERS.find((p) => p.id !== 'custom' && normUrl(p.baseUrl) === normUrl(baseUrl)) || PROVIDERS[0];

(function initProviderSelect() {
  const sel = $('cfg-provider');
  for (const p of PROVIDERS) {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    const p = PROVIDERS.find((x) => x.id === sel.value) || PROVIDERS[0];
    if (p.baseUrl) $('cfg-url').value = p.baseUrl;   // custom 不动用户已填的 URL
    $('cfg-model-list').innerHTML = p.models.map((m) => `<option value="${esc(m)}">`).join('');
    if (p.models.length && !p.models.includes($('cfg-model').value.trim())) $('cfg-model').value = p.models[0];
  };
})();

// 保存成功后是否自动接着生成：点「中译」/「重翻」发现没配 → 弹本表单 → 填完直接开跑
let cfgRetryGenerate = false;
let cfgRetryForce = false;   // 待重试的是不是「重翻」（regen 图标进来时旧译文还在，zh-toggle 点击语义不对，必须带 force）
let cfgRetryTranslate = false; // 待重试的是不是「划词翻译」（点「译」发现没配端点 → 填完自动重试这次翻译）

async function openCfgPop(retryGenerate) {
  cfgRetryGenerate = Boolean(retryGenerate);
  let cfg;
  try {
    cfg = await api('/translate/config');
  } catch (e) { toast('读取配置失败：' + e.message, 8000); return; }
  $('cfg-url').value = cfg.baseUrl || '';
  $('cfg-model').value = cfg.model || '';
  // 按已存 URL 回显供应商，并触发一次 onchange 补齐模型候选（但不覆盖已存模型/URL）
  const sel = $('cfg-provider');
  sel.value = providerOf(cfg.baseUrl).id;
  const keepUrl = $('cfg-url').value, keepModel = $('cfg-model').value;
  sel.onchange();
  $('cfg-url').value = keepUrl || $('cfg-url').value;
  $('cfg-model').value = keepModel || $('cfg-model').value;
  // 明文 key 不回传：留空 = 沿用已存的那把
  $('cfg-key').value = '';
  $('cfg-key').placeholder = cfg.hasApiKey ? `已保存（${cfg.apiKeyHint}），留空则不修改` : 'sk-...';
  // 生效配置的来源：界面保存的文件 优先于 profile 的 YAML 默认值——两条来源都有时不说明会分不清生效的是谁
  $('cfg-source').textContent =
    cfg.source === 'file' ? `当前生效：本界面保存的配置（key ${cfg.apiKeyHint}）`
    : cfg.source === 'profile' ? '当前生效：profile 默认配置（在本界面保存后会被覆盖）'
    : '';
  const pop = $('cfg-pop');
  pop.style.display = 'block';
  // 先显示再量尺寸（不像 #ask-pop 那样写死尺寸常量，免得跟 CSS 漂移）
  pop.style.left = Math.max(8, (window.innerWidth - pop.offsetWidth) / 2) + 'px';
  pop.style.top = Math.max(8, (window.innerHeight - pop.offsetHeight) / 3) + 'px';
  $('cfg-key').focus();
}
function closeCfgPop() { $('cfg-pop').style.display = 'none'; cfgRetryGenerate = false; cfgRetryForce = false; cfgRetryTranslate = false; }

$('cfg-open').onclick = () => openCfgPop(false);
$('cfg-cancel').onclick = closeCfgPop;

$('cfg-save').onclick = async () => {
  // retry/force/translate 先捞出来：closeCfgPop 会把这三个待确认态清零
  const btn = $('cfg-save'), label = btn.textContent, retry = cfgRetryGenerate, force = cfgRetryForce, retryTr = cfgRetryTranslate;
  btn.disabled = true; btn.textContent = '测试中…';
  try {
    // 服务端先打一发极小的 chat/completions 验证 url/key/model，通过才落盘
    await api('/translate/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        baseUrl: $('cfg-url').value.trim(),
        apiKey: $('cfg-key').value.trim(),
        model: $('cfg-model').value.trim(),
      }),
    });
  } catch (e) {
    toast('保存失败：' + e.message, 8000);
    return;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
  closeCfgPop();
  await refreshZhState();
  if (retry) startGenerate(force);  // 沿用触发来源的语义：zh-toggle=生成，regen=重翻
  else if (retryTr) translateSelection(); // 划词翻译发现没配端点 → 填完自动重试这一次翻译（§3.7①）
  else toast('翻译端点已保存');
};

/* ================= PDF 渲染(pdf.js:缩放 + devicePixelRatio 高清,移植自 pdfqa) ================= */
/* pdf.js 6.x 本地 vendor：动态 import（缓存的 Promise），loadPdf 先 await 再用——
   底部经典脚本解析期就开跑 bootstrap()，必须由这里保证「pdf.js 就绪后才渲染」；
   失败（vendor 404 / MIME 拒绝）抛带 URL 的可读错误，而不是莫名其妙的 ReferenceError。 */
let pdfjsReadyP = null;
function ensurePdfjs() {
  if (!pdfjsReadyP) {
    pdfjsReadyP = import('/paper-reader/vendor/pdf.min.mjs').then(
      (m) => {
        window.pdfjsLib = m;
        m.GlobalWorkerOptions.workerSrc = '/paper-reader/vendor/pdf.worker.min.mjs';
        return m;
      },
      (e) => {
        pdfjsReadyP = null; // 失败后清缓存：瞬时故障不至于让本页签永久坏掉，下次 loadPdf 重试
        throw new Error('pdf.js 加载失败（/paper-reader/vendor/pdf.min.mjs）：' + (e && e.message ? e.message : e));
      },
    );
  }
  return pdfjsReadyP;
}
ensurePdfjs().catch(() => {}); // 预热：与 bootstrap 的 API 请求并行拉取，不把首屏串行化

let pdfDoc = null;
let zoomScale = 1.5;
let dpr = window.devicePixelRatio || 1;
let renderToken = 0;

(function watchDpr() {
  const mq = matchMedia(`(resolution: ${dpr}dppx)`);
  mq.addEventListener('change', function onChange() {
    mq.removeEventListener('change', onChange);
    dpr = window.devicePixelRatio || 1;
    if (pdfDoc) rerender();
    watchDpr();
  });
})();

async function loadPdf(url, opts = {}) {
  await ensurePdfjs(); // 就绪前禁止触 pdfjsLib（defer 竞态，见文件头注释）
  pdfDoc = await pdfjsLib.getDocument({ url }).promise; // v6 起不接受字符串参数，必须传对象
  $('empty').style.display = 'none';
  // 翻页控件与模式切换按钮：文档就绪后才出现
  $('pager').style.display = '';
  $('mode-toggle').style.display = '';
  // 分屏（模式 B）自己安排两列的渲染与适宽：这里只把原文文档装上，不触发单列渲染
  if (opts.deferRender) return;
  if (fitMode) { fitToWidth(); return; } // fitToWidth 内部 setZoom → rerender
  await rerender();
}

/** 构建单页 DOM 骨架（.page + canvas + textLayer），位图与文本由 paintPage 异步填充。
 *  `doc` = 'orig' | 'zh'：**无条件**写在每个页节点上（分屏时两个文档的页号相同，热区几何
 *  与选区归属都靠它判别；只有分屏才写的话普通模式的选择器会取到 null）。 */
function makePageNode(i, viewport, doc = 'orig') {
  const div = document.createElement('div');
  div.className = 'page';
  div.dataset.page = i;
  div.dataset.doc = doc;
  div.style.width = viewport.width + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width * dpr);
  canvas.height = Math.ceil(viewport.height * dpr);
  canvas.style.width = viewport.width + 'px';
  canvas.style.height = viewport.height + 'px';
  div.appendChild(canvas);

  const tl = document.createElement('div');
  tl.className = 'textLayer';
  tl.style.width = viewport.width + 'px';
  tl.style.height = viewport.height + 'px';
  tl.style.setProperty('--scale-factor', String(viewport.scale));
  div.appendChild(tl);
  return div;
}

/** 渲染单页内容（canvas 位图 + pdf.js 6.x TextLayer 文本层）。token 失效（被更新的渲染
    抢占）时中途放弃——旧 renderAllPages 循环体里的守卫原样搬进来。 */
async function paintPage(page, div, viewport, token) {
  const canvas = div.firstChild;
  const tl = div.lastChild;
  await page.render({
    canvasContext: canvas.getContext('2d'),
    viewport,
    transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
  }).promise;
  if (token !== renderToken) return;
  const tc = await page.getTextContent();
  if (token !== renderToken) return;
  // pdf.js 6.x: renderTextLayer() 移除，改 TextLayer 类
  await new pdfjsLib.TextLayer({ textContentSource: tc, container: tl, viewport }).render();
  // 公式热区层（pointer-events:none，只画描边；命中在 JS 里按坐标算）。
  // 唯一铺层点放在这里（不是各自的渲染循环里）：滚动与翻页两条路径共用它——
  // renderPaged 完全绕过 renderAllPages 的循环，写在那边翻页模式热区会全哑。
  // 也不放进 makePageNode：它靠 div.firstChild/lastChild 取 canvas/textLayer，
  // 提前 append 热区层会让 lastChild 变成热区层 → TextLayer 挂错容器、文本层错位。
  // token 守卫（t4 评审 O5）：TextLayer.render() 也是 await，期间可能已被更新的渲染抢占；
  // 少了这一行，被抢占的收尾会把**上一档缩放**的几何写回 EQ_BY_PAGE → 点击热区整体偏移。
  if (token !== renderToken) return;
  paintEqLayer(div, viewport, +div.dataset.page);
}

/** 当前模式的全量重渲入口：缩放/DPR/换文档/换变体统一走这里。
 *  分屏（模式 B）是第三套布局，转到 renderSplit()；renderPaged/renderAllPages 的既有语义**不变**。 */
function rerender() {
  if (viewMode === 'split') return renderSplit();
  return pageMode === 'paged' ? renderPaged() : renderAllPages();
}

// 隐藏期间被跳过的重渲请求：尺寸恢复（resize）后补跑。
// ⚠️ 曾经的坑（用户实测「点放大后全空白」）：守卫在 ++renderToken 之后——隐藏期间的
// 渲染请求先作废在途渲染、自己又因高度 0 提前返回，容器已被清空却无人再画；且退出
// 适宽模式后 resize 只重算适宽（if (fitMode)），不补渲 → 永久空白。改为：隐藏期间
// 的请求直接跳过（不动 token、在途渲染照常画完），标记 pending 等恢复后补画。
let pendingRerender = false;

async function renderAllPages() {
  const pane = $('pdf-pane');
  if (pane.clientHeight === 0) { pendingRerender = true; return; } // 悬浮层隐藏期间不重渲（否则锚点恢复会把滚动清零）
  const token = ++renderToken;
  const container = $('pdf-pages');
  const scale = zoomScale; // 单次渲染内快照：隐藏期间的 setZoom 改全局值也不至于画出混合缩放
  // 滚动比例锚点：不用 DOM rect（并发重渲时旧页可能已被清空，rect 全灭 → 锚点归零）
  const range = pane.scrollHeight - pane.clientHeight;
  const anchorRatio = range > 0 ? pane.scrollTop / range : 0;
  container.innerHTML = '';
  container.classList.remove('paged'); // 切回滚动：必须摘掉单页布局类（paged 由 renderPaged 加上）
  clearEqGeometry();                   // 旧页几何 + 跨页残留的 hover/hit 描边随 DOM 一起作废
  $('zoom-label').textContent = Math.round(scale / 1.5 * 100) + '%';

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (token !== renderToken) return;
    const page = await pdfDoc.getPage(i);
    if (token !== renderToken) return;
    const viewport = page.getViewport({ scale });
    const div = makePageNode(i, viewport);
    container.appendChild(div);
    // 位图 + 文本层 + 公式热区层都在 paintPage 里（滚动/翻页两条路径共用同一个铺层点）
    await paintPage(page, div, viewport, token);
    if (token !== renderToken) return;
  }
  const newRange = pane.scrollHeight - pane.clientHeight;
  pane.scrollTop = anchorRatio * Math.max(0, newRange);
  observePages();
}

/** 翻页模式：只渲染 curPage 一页（按需渲染，天然无长文档性能问题）。 */
async function renderPaged() {
  if ($('pdf-pane').clientHeight === 0) { pendingRerender = true; return; } // 同 renderAllPages：跳过并标记，恢复后补画
  const token = ++renderToken;
  const container = $('pdf-pages');
  const scale = zoomScale; // 同 renderAllPages：快照，防混合缩放
  curPage = Math.min(Math.max(1, curPage), pdfDoc.numPages);
  container.innerHTML = '';
  clearEqGeometry(); // 同上：翻页模式下换页/缩放时，旧页几何与 hover 残留必须一起作废（否则命中整体偏移）
  container.classList.add('paged');
  $('zoom-label').textContent = Math.round(scale / 1.5 * 100) + '%';
  updatePager();
  const page = await pdfDoc.getPage(curPage);
  if (token !== renderToken) return;
  const viewport = page.getViewport({ scale });
  const div = makePageNode(curPage, viewport);
  container.appendChild(div);
  await paintPage(page, div, viewport, token);
}

/** 滚动模式当前页探测：视口竖直中线带（±45%）压到哪页，哪页就是当前页。
    每次全量重渲后重建（页节点全换）。翻页控件与模式切换共享 curPage。 */
let pageObserver = null;
function observePages() {
  pageObserver?.disconnect();
  pageObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) {
        curPage = +en.target.dataset.page || curPage;
        updatePager();
      }
    }
  }, { root: $('pdf-pane'), rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  document.querySelectorAll('#pdf-pages .page').forEach((d) => pageObserver.observe(d));
}

function setZoom(newScale) { if (!pdfDoc) return; zoomScale = Math.min(4.5, Math.max(0.6, newScale)); rerender(); }
// 默认适宽：rightbar 窄列里 1.5 倍缩放会把页面撑出视口（中英对照双栏页宽≈2×，更明显）
let fitMode = true;
const fitBtn = $('zoom-fit');
fitBtn.classList.add('active');
function exitFitMode() { fitMode = false; fitBtn.classList.remove('active'); }
/** 适宽的可用宽度（分屏时按**较窄的那一列**算，保证两列页高一致）。每列 padding 16px×2。 */
function fitPaneWidth() {
  if (viewMode === 'split') {
    const avail = [$('pdf-pane').clientWidth - 32, $('pdf-pane-zh').clientWidth - 32].filter((w) => w > 0)
    if (!avail.length) return 0
    return Math.min(...avail)
  }
  return $('pdf-pane').clientWidth - 32
}
function fitToWidth() {
  if (!pdfDoc) return // resize 可能先于首次 loadPdf 触发（布局换位/条带注入会改容器尺寸）
  const paneWidth = fitPaneWidth()
  if (paneWidth <= 0) return // 隐藏期间尺寸为 0，算出的缩放无意义
  pdfDoc.getPage(1).then((p) => setZoom(paneWidth / p.getViewport({ scale: 1 }).width))
}
$('zoom-in').onclick = () => { exitFitMode(); setZoom(zoomScale + 0.25); };
$('zoom-out').onclick = () => { exitFitMode(); setZoom(zoomScale - 0.25); };
fitBtn.onclick = () => { if (!pdfDoc) return; fitMode = true; fitBtn.classList.add('active'); fitBtn.blur(); fitToWidth(); };
window.addEventListener('resize', () => {
  if (viewMode === 'split' && window.innerWidth < SPLIT_MIN_WIDTH) {
    // 分屏被缩到硬闸门以下：回落原文 + 同一提示（§4.2）
    toast('面板太窄，请把阅读器拉宽后再用分屏对照', 4000);
    setViewMode('orig');
    return;
  }
  if (fitMode) fitToWidth(); // setZoom → rerender，顺带消化 pendingRerender
  else if (pendingRerender && pdfDoc) { pendingRerender = false; rerender(); } // 隐藏期间欠下的重渲，恢复尺寸后补画
});

/** 原文列的页节点：分屏时中文列有**同样的 page 号**，不加限定会取到中文列（C18/R7）。
 *  统一收敛到 `#pdf-pages` 之下——四个引文高亮/跳转入口共用。 */
function origPageNode(n) {
  return document.querySelector(`#pdf-pages .page[data-page="${n}"]`);
}

/* ================= 翻页模式：页码控件 + 模式切换 + 键盘 ================= */
function flashPage() {
  const div = origPageNode(curPage);
  if (!div) return;
  div.classList.add('flash');
  setTimeout(() => div.classList.remove('flash'), 1600);
}

/** 页码控件刷新：输入框（未聚焦时才回写，别打断正在敲页码的人）/总页数/首末页禁用。 */
function updatePager() {
  const total = pdfDoc ? pdfDoc.numPages : 0;
  $('page-total').textContent = '/ ' + (total || '?');
  const input = $('page-input');
  if (document.activeElement !== input) input.value = total ? curPage : '';
  $('page-prev').disabled = pageMode === 'paged' && curPage <= 1;
  $('page-next').disabled = pageMode === 'paged' && curPage >= total;
}

/** 跳到第 n 页（夹取）：paged 重渲单页+闪烁；scroll 平滑滚到该页。 */
async function goPage(n) {
  if (!pdfDoc) return;
  const p = Math.min(Math.max(1, (n | 0) || 1), pdfDoc.numPages);
  if (pageMode === 'paged') {
    if (p === curPage) { flashPage(); return; }
    curPage = p;
    await rerender();
    flashPage();
  } else {
    curPage = p;
    jumpToPage(p);
  }
}

$('page-prev').onclick = () => goPage(curPage - 1);
$('page-next').onclick = () => goPage(curPage + 1);
function commitPageInput() {
  const v = parseInt($('page-input').value, 10);
  if (Number.isFinite(v) && v >= 1) goPage(v);
  else updatePager(); // 非法输入：恢复当前页显示
}
// Enter 走 blur 统一提交；Escape 只恢复显示不跳页（标志位让 blur 知道这是放弃编辑）
let pageInputEscaped = false;
$('page-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  else if (e.key === 'Escape') { pageInputEscaped = true; e.target.blur(); }
});
$('page-input').addEventListener('blur', () => {
  if (pageInputEscaped) { pageInputEscaped = false; updatePager(); return; }
  commitPageInput();
});

/** 模式切换：paged→scroll 先全量渲染再跳回当前页；scroll→paged 用观察器最近回写的 curPage。
    图标显示「当前模式」：书本 = 单页翻页（active）/ 卷轴 = 连续滚动。 */
function updateModeToggle() {
  const btn = $('mode-toggle');
  btn.innerHTML = iconHtml(pageMode === 'paged' ? 'paged' : 'scroll');
  btn.classList.toggle('active', pageMode === 'paged');
  btn.title = pageMode === 'paged' ? '当前：单页翻页，点击切回连续滚动' : '当前：连续滚动，点击切到单页翻页';
  updatePager();
}
$('mode-toggle').onclick = async () => {
  if (!pdfDoc) return;
  pageMode = pageMode === 'paged' ? 'scroll' : 'paged';
  localStorage.setItem('dpr.pageMode', pageMode);
  updateModeToggle();
  if (pageMode === 'paged') {
    await rerender();          // 分屏时转 renderSplit（两列同渲 curPage）
    flashPage();
  } else {
    await rerender();          // 非分屏时等价于 renderAllPages
    jumpToPage(curPage);
  }
};
updateModeToggle();

// 键盘翻页（仅 paged）：输入框聚焦/带修饰键时不抢；Space 在单页模式下无滚动量，拿来做下一页
document.addEventListener('keydown', (e) => {
  if (pageMode !== 'paged' || !pdfDoc) return;
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goPage(curPage + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goPage(curPage - 1); }
  else if (e.key === 'Home') { e.preventDefault(); goPage(1); }
  else if (e.key === 'End') { e.preventDefault(); goPage(pdfDoc.numPages); }
});

function jumpToPage(n) {
  if (pageMode === 'paged') { goPage(n); return; }
  const div = origPageNode(n);   // 引文跳转只作用于原文列（分屏时中文列不得被滚到）
  if (!div) return;
  div.scrollIntoView({ behavior: 'smooth', block: 'start' });
  div.classList.add('flash');
  setTimeout(() => div.classList.remove('flash'), 1600);
}

/* 片段定位高亮（跳转链接的 &q= 引文）：在指定页 textLayer 里找 q、高亮并滚到它。
   归一化时忽略空白/连字符/软连字符、大小写 —— 论文跨行断词（dis-tributed）也能命中。
   找不到（如用户在中文界面而 q 是英文原文）返回 false，调用方退回仅跳页。 */
function clearHighlights() {
  document.querySelectorAll('.textLayer span.dpr-hl').forEach((sp) => sp.classList.remove('dpr-hl'));
  clearEqHit(); // 公式命中描边与引文高亮同生共死（用户在别处点一下即清）
}
// 高亮的消失交给用户：阅读器里任意点一下即清（mousedown 比 click 早，划选文字的那一下也算）
document.addEventListener('mousedown', clearHighlights);

function highlightSnippet(page, q) {
  const spans = [...(origPageNode(page)?.querySelectorAll('.textLayer span:not(.markedContent)') ?? [])];
  if (!spans.length || !q) return false;
  let hay = '';
  const startOf = [];
  for (const sp of spans) { startOf.push(hay.length); hay += sp.textContent; }
  // 归一化串 + 回原串的索引映射（归一化改变长度，不能直接用原索引）
  const map = [];
  let nh = '';
  for (let i = 0; i < hay.length; i++) {
    const c = hay[i].toLowerCase();
    if (/\s/.test(c) || c === '-' || c === '­') continue;
    nh += c; map.push(i);
  }
  const needle = q.toLowerCase().replace(/[\s\-­]+/g, '');
  const at = needle ? nh.indexOf(needle) : -1;
  if (at < 0) return false;
  const from = map[at], to = map[at + needle.length - 1] + 1;
  const hit = spans.filter((sp, i) => startOf[i] < to && startOf[i] + sp.textContent.length > from);
  if (!hit.length) return false;
  clearHighlights();
  for (const sp of hit) sp.classList.add('dpr-hl');
  hit[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  return true;
}

/* 统一跳转入口：先等目标页渲染出来（fit 模式下 loadPdf 返回时页面可能还在渲），
   有 q 就尝试片段高亮，否则整页跳转 + 边框闪烁。
   paged 模式目标页不在 DOM 里（只渲当前页），轮询永远等不到 → 直接设页渲染。 */
async function jumpTo(page, q) {
  const p0 = Math.max(1, (page | 0) || 1);
  if (pageMode === 'paged') {
    if (!pdfDoc) return;
    const p = Math.min(p0, pdfDoc.numPages);
    if (p !== curPage) { curPage = p; await rerender(); }
    if (!(q && highlightSnippet(p, q))) flashPage();
    return;
  }
  for (let i = 0; i < 100; i++) {
    if (pdfDoc && origPageNode(Math.min(p0, pdfDoc.numPages))) {
      const p = Math.min(p0, pdfDoc.numPages);
      if (!(q && highlightSnippet(p, q))) jumpToPage(p);
      return;
    }
    await new Promise((r) => setTimeout(r, 100));
  }
}

/* ================= 公式引用（MinerU LaTeX，契约 §1） =================
   PDF 文本层里的公式是乱码（`𝑧𝑧1 𝑧𝑧2`），鼠标选中拿不到可用内容；真相源是 MinerU
   content_list 的 equation 块（LaTeX + bbox）。bbox 坐标系实测为「页面归一化坐标 ×1000」
   （x÷页宽、y÷页高，各自归一），映射直接用渲染时的同一个 viewport，因此与缩放无关：
       x = bbox[0]/1000*viewport.width ，y = bbox[1]/1000*viewport.height
   热区外扩 6pt（实测最坏欠覆盖 4.60pt；6pt 覆盖全部 17/17 公式块）。 */
const EQ_PAD = 6;                 // pt（= scale 1 时的 CSS px），随 zoomScale 放大
let eqIndex = { source: 'none', equations: [], reason: 'no-mineru-artifact', bboxSpace: 'normalized-1000' };
const EQ_BY_PAGE = new Map();     // pageNo → [{eq,x0,y0,x1,y1,w,h,pad}]
let eqHoverId = null;

/** 页节点被整体重建（renderAllPages / renderPaged 里 `container.innerHTML = ''`）时调用：
    旧页的几何必须一起作废，否则命中测试会打到已卸载的页/上一档缩放的矩形（翻页模式下表现为
    「点击整体偏移」）；顺手清掉跨页残留的 hover 态 —— eqHoverId 不清的话，setEqHover(id) 会在
    `id === eqHoverId` 时提前 return，换页后鼠标停在公式上也不再出现虚线描边。 */
function clearEqGeometry() {
  EQ_BY_PAGE.clear();
  eqHoverId = null;
  clearEqHit();
}

/** 去掉 MinerU 文本外层 `$$`：`$$\n\\pi…\n$$` → `\pi…` */
function eqLatex(raw) {
  return String(raw == null ? '' : raw).replace(/^\s*\$\$?/, '').replace(/\$\$?\s*$/, '').trim();
}
/** 进会话的引用串：保留 `$$` 定界（模型对数学最友好） */
function eqCite(eq) { return '$$ ' + eqLatex(eq.latex) + ' $$'; }

/**
 * MinerU **生效 mode**（GET /mineru/config 的 mode 字段）：'off' | 'local' | 'cloud' | null(未知)。
 * 它是「重新转录」按钮的门控依据——`source:'auto'` 会按 mode 选引擎，而 mode==='off' 时
 * auto 落到 pdf.js，pdf.js 重解析会**删掉** <文献>.mineru.md/.mineru.json 富产物
 * （src/transcribe.ts）；宁可少一个按钮，也不给一个会反噬的按钮。
 */
let mineruMode = null;
async function loadMineruMode() {
  try {
    const c = await api('/mineru/config');
    mineruMode = c && typeof c.mode === 'string' ? c.mode : null;
  } catch { mineruMode = null; }   // 取不到按「未知」处理（照常给按钮，行为与旧版一致）
}

function loadFormulas() {
  return (async () => {
    eqIndex = { source: 'none', equations: [], reason: 'no-mineru-artifact', bboxSpace: 'normalized-1000' };
    if (!current) { renderEqPanel(); return; }
    await loadMineruMode();
    const q = `topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`;
    try {
      const idx = await api('/formulas?' + q);
      if (idx && Array.isArray(idx.equations)) eqIndex = idx;
    } catch (e) {
      // 接口异常绝不打崩阅读器：降级成「无公式」，划词提问照常
      eqIndex = { source: 'none', equations: [], reason: 'bad-artifact', warning: e.message, bboxSpace: 'normalized-1000' };
    }
    const btn = $('eq-toggle');
    btn.classList.toggle('muted', eqIndex.equations.length === 0);
    btn.title = eqIndex.equations.length
      ? `公式引用：${eqIndex.equations.length} 个（点击 PDF 上的公式即可引用其 LaTeX）`
      : '公式引用：本论文还没有 MinerU 解析产物';
    renderEqPanel();
  })();
}

/** 热区只在「原文视图 + 有 bbox」时开启：译文版（-zh/-dual）页面几何与原文不同。 */
function eqHotEnabled() {
  return zhVariant === null && eqIndex.equations.some((e) => e.bbox);
}

function eqGeom(eq, viewport) {
  if (!eq.bbox) return null;
  const space = eqIndex.bboxSpace === 'page-units'; // 兜底分支（云端版本差异，见需求 R3）
  const kx = space ? zoomScale : viewport.width / 1000;
  const ky = space ? zoomScale : viewport.height / 1000;
  const x = eq.bbox[0] * kx;
  const y = eq.bbox[1] * ky;
  const w = (eq.bbox[2] - eq.bbox[0]) * kx;
  const h = (eq.bbox[3] - eq.bbox[1]) * ky;
  if (!(w > 0) || !(h > 0)) return null;
  return {
    eq, x, y, w, h, pad: EQ_PAD * zoomScale,
    x0: Math.max(0, x), y0: Math.max(0, y),
    x1: Math.min(viewport.width, x + w), y1: Math.min(viewport.height, y + h),
  };
}

/** 为已渲染的一页铺热区层（只画描边，不接事件）。
 *  **只在原文列铺**：分屏（模式 B）时中文列的页号与原文列相同，而 EQ_BY_PAGE 是全局的，
 *  照铺会让中文列的点击命中原文几何（C18/R7）。文档作用域从页节点自身读——唯一铺层点的
 *  调用签名被既有断言钉死为 `paintEqLayer(div, viewport, +div.dataset.page)`
 *  （test/merge-verify-t3.test.mjs 的 checkSolePaintPoint），不能再加第 4 个参数。 */
function paintEqLayer(pageDiv, viewport, pageNo) {
  const old = pageDiv.querySelector('.eqLayer');
  if (old) old.remove();
  const items = [];
  const doc = pageDiv.dataset.doc || 'orig';
  if (doc !== 'orig') return;   // 中文列：不建层、不写 EQ_BY_PAGE
  if (eqHotEnabled()) {
    const lay = document.createElement('div');
    lay.className = 'eqLayer';
    lay.style.width = viewport.width + 'px';
    lay.style.height = viewport.height + 'px';
    for (const eq of eqIndex.equations) {
      if (eq.page !== pageNo) continue;
      const g = eqGeom(eq, viewport);
      if (!g) continue;
      items.push(g);
      const b = document.createElement('div');
      b.className = 'eq-box';
      b.dataset.eqId = eq.id;
      b.style.left = g.x0 + 'px';
      b.style.top = g.y0 + 'px';
      b.style.width = Math.max(1, g.x1 - g.x0) + 'px';
      b.style.height = Math.max(1, g.y1 - g.y0) + 'px';
      lay.appendChild(b);
    }
    pageDiv.appendChild(lay);
  }
  EQ_BY_PAGE.set(pageNo, items);
}

/**
 * 命中判定（契约 §1.4）：
 *   1) 未外扩矩形包含点击点 → 取面积最小者（并列取阅读序靠前）；
 *   2) 否则取外扩后包含该点、且到未外扩矩形距离最小者（并列同上）；
 *   3) 都没有 → 不是公式点击。
 * 为什么必须严格：实测同一页相邻公式块竖直间隙最小只有 0.8pt，6pt 外扩后必然重叠。
 */
function hitTestFormula(e) {
  if (!eqHotEnabled()) return null;
  const el = e.target;
  const pageDiv = el && el.closest ? el.closest('.page[data-page]') : null;
  if (!pageDiv) return null;
  // 中文列（分屏）不得命中：它的页号与原文列相同，几何却属于原文页面（C18/R7）
  if (pageDiv.dataset.doc && pageDiv.dataset.doc !== 'orig') return null;
  const items = EQ_BY_PAGE.get(+pageDiv.dataset.page);
  if (!items || !items.length) return null;
  const box = pageDiv.getBoundingClientRect();
  const px = e.clientX - box.left;
  const py = e.clientY - box.top;
  let best = null;
  for (const it of items) {
    if (px >= it.x0 && px <= it.x1 && py >= it.y0 && py <= it.y1) {
      if (!best || it.w * it.h < best.w * best.h) best = it;
    }
  }
  if (best) return best;
  let bestD = Infinity;
  for (const it of items) {
    if (px < it.x0 - it.pad || px > it.x1 + it.pad || py < it.y0 - it.pad || py > it.y1 + it.pad) continue;
    const dx = px < it.x0 ? it.x0 - px : (px > it.x1 ? px - it.x1 : 0);
    const dy = py < it.y0 ? it.y0 - py : (py > it.y1 ? py - it.y1 : 0);
    const d = dx * dx + dy * dy;
    if (d < bestD - 1e-6) { bestD = d; best = it; }
    else if (Math.abs(d - bestD) <= 1e-6 && best && it.w * it.h < best.w * best.h) best = it;
  }
  return best;
}

function setEqHover(id) {
  if (id === eqHoverId) return;
  eqHoverId = id;
  document.querySelectorAll('.eq-box.hover').forEach((el) => el.classList.remove('hover'));
  if (id) {
    const el = document.querySelector(`.eq-box[data-eq-id="${id}"]`);
    if (el) el.classList.add('hover');
  }
}

function clearEqHit() { document.querySelectorAll('.eq-box.hit').forEach((el) => el.classList.remove('hit')); }

function markEqHit(eq) {
  clearEqHit();
  const el = document.querySelector(`.eq-box[data-eq-id="${eq.id}"]`);
  if (el) el.classList.add('hit');
}

/** 引用一个公式：热区点击与面板条目共用这一条链路（契约 §1.5）。 */
function citeFormula(eq, x, y) {
  askSelection = {
    text: eqCite(eq),
    page: eq.page,
    kind: 'equation',
    latex: eqLatex(eq.latex),
    equationIndex: eq.index,
  };
  markEqHit(eq);
  const tag = `第 ${eq.page} 页 · 公式 ${eq.index}`;
  const body = eqLatex(eq.latex).replace(/\s+/g, ' ');
  showAskPop({ quote: body ? `${tag}：${body}` : tag, x, y });
}

function renderEqPanel() {
  const meta = $('eq-meta');
  const list = $('eq-list');
  const eqs = eqIndex.equations;
  list.innerHTML = '';
  if (eqs.length) {
    const src = [eqIndex.producer || 'MinerU', eqIndex.backend].filter(Boolean).join(' · ');
    meta.textContent = `${eqs.length} 个公式 · ${src}${eqIndex.warning ? '（' + eqIndex.warning + '）' : ''}`;
  } else {
    meta.textContent = '';
  }
  if (zhVariant !== null) {
    const n = document.createElement('div');
    n.id = 'eq-note';
    n.textContent = '当前是译文视图：没有公式位置信息（bbox 只对原文页面成立），切回原文即可点击公式。';
    list.appendChild(n);
  }
  if (!eqs.length) {
    const n = document.createElement('div');
    n.id = 'eq-note';
    n.textContent = eqIndex.reason === 'bad-artifact'
      ? 'MinerU 产物损坏或不可读，已忽略（不影响阅读与划词提问）。'
      : eqIndex.reason === 'no-equations'
        ? '这篇论文没有解析出公式块（MinerU 产物存在，但 content_list 里没有 equation）。'
        : mineruMode === 'off'
          ? '未启用 MinerU：请到 dsh 设置 → 论文伴读 → MinerU 解析后端 选择「本地」或「云端」并保存，然后回到这里点「重新转录」。'
          : '未找到 MinerU 解析产物。在 dsh 设置 → 论文伴读 → MinerU 解析后端 启用后点下面按钮重新转录。';
    list.appendChild(n);
    // 门控：mode==='off' 时不渲染按钮（auto 会落到 pdf.js 并删掉已有的 MinerU 富产物）；
    // mode 未知（接口不可用）时照旧给按钮，保持与旧版一致的行为。
    const canRetranscribe = (eqIndex.reason === 'no-mineru-artifact' || eqIndex.reason === 'no-equations') && mineruMode !== 'off';
    if (canRetranscribe) {
      const b = document.createElement('button');
      b.id = 'eq-transcribe';
      b.className = 'tbtn';
      b.textContent = '用 MinerU 重新转录';
      b.onclick = () => transcribeWithMineru(b);
      list.appendChild(b);
    }
    return;
  }
  const byPage = new Map();
  for (const eq of eqs) {
    if (!byPage.has(eq.page)) byPage.set(eq.page, []);
    byPage.get(eq.page).push(eq);
  }
  for (const [page, arr] of byPage) {
    const h = document.createElement('div');
    h.className = 'eq-page';
    h.textContent = `第 ${page} 页`;
    list.appendChild(h);
    for (const eq of arr) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'eq-item';
      item.dataset.eqId = eq.id;
      const tag = document.createElement('span');
      tag.className = 'eq-tag';
      tag.textContent = `公式 ${eq.index}${eq.bbox ? '' : ' · 无位置信息'}`;
      const code = document.createElement('code');
      code.textContent = eqLatex(eq.latex) || '(空)';
      item.appendChild(tag);
      item.appendChild(code);
      item.onclick = () => {
        const r = item.getBoundingClientRect();
        citeFormula(eq, r.left, r.bottom + 6);
      };
      list.appendChild(item);
    }
  }
}

async function transcribeWithMineru(btn) {
  if (!current) return;
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '转录中（可能需要几十秒）…';
  try {
    await api('/transcribe', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      // source:'auto' = 按**当前生效 mode** 选引擎（local → 本地 MinerU；cloud → mineru.net 云端；
      // off → pdf.js）。硬编码 'mineru-local' 会让配了云端的用户点一次失败一次（上游评审第 6 条）。
      // 按钮本身在 mode==='off' 时不渲染（见 renderEqPanel 的门控），所以走到这里 mode 必为 local/cloud。
      body: JSON.stringify({ ...current, force: true, source: 'auto' }),
    });
    toast('MinerU 转录完成');
    await loadFormulas();
    // 新索引到手：按**当前模式**重渲一次把热区铺上去（翻页模式下必须仍是 renderPaged，
    // 否则会把全量页渲出来、摘掉 #pdf-pages 的 paged 类，与顶栏模式切换按钮的 active 状态脱节）
    if (pdfDoc) await rerender();
  } catch (e) {
    toast('MinerU 转录失败：' + e.message, 6000);
  } finally {
    if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = old; }
  }
}

$('eq-toggle').onclick = () => {
  const open = $('eq-panel').style.display !== 'block';
  $('eq-panel').style.display = open ? 'block' : 'none';
  $('eq-toggle').classList.toggle('active', open);
};

let lastMove = { x: -1, y: -1 };
document.addEventListener('mousemove', (e) => {
  if (!eqHotEnabled()) { setEqHover(null); return; }
  if (Math.abs(e.clientX - lastMove.x) < 2 && Math.abs(e.clientY - lastMove.y) < 2) return;
  lastMove = { x: e.clientX, y: e.clientY };
  const hit = hitTestFormula(e);
  setEqHover(hit ? hit.eq.id : null);
});

/* ================= 选中即问（文字 + 公式共用一条链路） ================= */
const askPop = $('ask-pop');
let askSelection = null;
// 拖拽起点：公式「点击」判定要求 mousedown→mouseup 位移很小（拖选文字不算点击）
let downPt = null;

/** 弹层共用的展示动作（文字引用与公式引用都走这里）。 */
function showAskPop(o) {
  $('ask-quote').textContent = o.quote.length > 140 ? o.quote.slice(0, 140) + '…' : o.quote;
  $('ask-input').value = '';
  $('ask-copy').style.display = askSelection && askSelection.kind === 'equation' ? 'inline-block' : 'none';
  // 「译」只在「纯文字选区 + 原文视图 + **原文列** + 长度可翻译」时出现。
  // 分屏（模式 B）时 zhVariant 刻意保持 null（C17），中文列也满足那个条件 —— 但中文列的字符
  // 在 collectSelectionChars 里会被整体跳过（几何只对原文页成立）⇒ chunks 为空、只会弹
  // 「选区已失效」。所以这里按列禁用（R-07：e.target/doc 判别），不给误导性文案。
  $('ask-translate').style.display =
    askSelection && askSelection.kind === 'text' && zhVariant === null
      && (askSelection.doc ?? 'orig') === 'orig'
      && askSelection.text.length <= MAX_SELECTION_CHARS
      ? 'inline-block' : 'none';
  hideTrPop(); // 新选区/新引用出现即收起上一个译文气泡（同一锚点必然重叠）
  invalidateTranslate(); // R-01：新选区/新引用必须让在飞请求失效，否则旧译文会盖到新锚点上
  askPop.style.display = 'block';
  // 夹在 iframe 视口内（rightbar 窄列里也要能用）
  const popW = 336, popH = 200;
  askPop.style.left = Math.max(8, Math.min(o.x, window.innerWidth - popW - 8)) + 'px';
  askPop.style.top = Math.max(8, Math.min(o.y, window.innerHeight - popH - 8)) + 'px';
  $('ask-input').focus();
}

document.addEventListener('mousedown', (e) => { downPt = { x: e.clientX, y: e.clientY }; }, true);

document.addEventListener('mouseup', (e) => {
  if (askPop.contains(e.target)) return;
  setTimeout(() => {
    const moved = downPt ? Math.abs(e.clientX - downPt.x) + Math.abs(e.clientY - downPt.y) > 4 : false;
    downPt = null;
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim() : '';
    if (!text || !current) {
      // 无选区（或没有当前文献）时才尝试公式点击 —— 有选区时「划词提问」优先，绝不抢。
      if (!text && !moved && current) {
        const hit = hitTestFormula(e);
        if (hit) { citeFormula(hit.eq, e.clientX, e.clientY + 6); return; }
      }
      askPop.style.display = 'none';
      return;
    }
    const node = sel.anchorNode && sel.anchorNode.parentElement;
    if (!node || !node.closest('.textLayer')) { askPop.style.display = 'none'; return; }
    const range = sel.getRangeAt(0).getBoundingClientRect();
    // `doc` = 选区落在哪一列（'orig' | 'zh'）：分屏时中文列也有 .page 与文本层，但它的几何
    // 对不上原文的 equation 索引，且不该出现「译」（R-07）。无条件写：普通模式恒为 'orig'。
    const pageEl = node.closest('.page[data-doc]') || node.closest('.page');
    askSelection = {
      text,
      page: +((pageEl || {}).dataset?.page || 0) || null,
      kind: 'text',
      doc: (pageEl && pageEl.dataset && pageEl.dataset.doc) || 'orig',
    };
    // 选区 Range 必须在**选中时**克隆存下来：用户点「译」时浏览器多半已清掉选区。
    // 防御：DOM stub / 极端环境下 getRangeAt 可能不返回 Range（没有 cloneRange），此时存 null，
    // 点「译」时按「页面已重绘，请重新选择」如实提示——绝不静默失败。
    try {
      const r0 = sel.getRangeAt(0);
      if (r0 && typeof r0.cloneRange === 'function') askSelection.range = r0.cloneRange();
    } catch { /* 选区已失效：保持无 range */ }
    showAskPop({ quote: text, x: e.clientX, y: range.bottom + 8 });
  }, 10);
});
document.addEventListener('mousedown', (e) => { if (!askPop.contains(e.target)) askPop.style.display = 'none'; });
$('ask-cancel').onclick = () => { askPop.style.display = 'none'; };

// 复制 LaTeX（显式动作：不自动写剪贴板，静默覆盖用户剪贴板是意外副作用）
$('ask-copy').onclick = async () => {
  const latex = askSelection && askSelection.kind === 'equation' ? askSelection.text : '';
  if (!latex) return;
  // 只在用户显式点按钮时写剪贴板；引用公式/弹气泡本身绝不自动写
  toast((await copyText(latex)) ? '已复制公式 LaTeX' : '复制失败，请手动选择文本', 5000);
};

/** 剪贴板写入的**唯一**实现（路径复制与复制 LaTeX 共用）：clipboard API 优先，
 *  失败/不可用（iframe 权限、非安全上下文）退回 textarea + execCommand。
 *  返回是否成功——文案由调用方决定。 */
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* 走下面的兜底 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    return true;
  } catch { return false; }
}

$('ask-send').onclick = async () => {
  const question = $('ask-input').value.trim();
  if (!question || !askSelection || !current) return;
  $('ask-send').disabled = true;
  try {
    // 会话序号由侧栏树激活时写入 localStorage（默认最新）
    const key = `dpr.sessionN.${current.topic}/${current.name}`;
    const n = +(localStorage.getItem(key) || 0) || undefined;
    // 公式引用额外带 kind/equationIndex：host 侧据此换用「引用了公式（LaTeX 源）」文案
    const eq = askSelection.kind === 'equation'
      ? { kind: 'equation', equationIndex: askSelection.equationIndex }
      : {};
    const r = await api('/ask', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        ...current, question, selectedText: askSelection.text, page: askSelection.page, ...eq, ...(n ? { n } : {}),
        // 默认「本篇」**不传 scope**（与改造前逐字节一致）；只有明确切到专题时才传
        ...(askScopeMode() === 'topic' ? { scope: { kind: 'topic', topic: current.topic } } : {}),
      }),
    });
    askPop.style.display = 'none';
    toast(askSelection.kind === 'equation' ? `已引用公式并发送到 会话${r.n}` : `已发送到 会话${r.n}，回答见对话区`);
  } catch (e) { toast('提问失败：' + e.message, 6000); }
  $('ask-send').disabled = false;
};
$('ask-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask-send').click(); } });

/* =====================================================================================
   划词翻译（公式保留）—— 契约 docs/selection-translate-requirements.md §3.1–§3.3
   · 触发：既有 #ask-pop 里新增的「译」按钮 → 隐藏 #ask-pop、弹独立译文气泡 #tr-pop
   · 气泡**只有译文**（#tr-body）+ 状态行 + 一行诚实提示（#tr-note）；内部零 button
   · 选区切块：display 公式按「字符矩形中心点 ∩ equation 盒」整段丢掉乱码、换成紧凑 LaTeX；
     行内公式的还原在服务端做（客户端只送 chunk，不送任何矩形/bbox）
   · 新代码一律放在 $('ask-cancel').onclick **之后**（既有源码切片断言，
     test/reader-ux-verification.test.mjs VA9）
   ===================================================================================== */
const MAX_SELECTION_CHARS = 4000;   // 冻结：选区超长截断并提示
const MAX_CHUNKS = 200;             // 与服务端同一套上限（§3.2-6）
const MAX_TOTAL_CHARS = 8000;
const TR_CLIENT_TIMEOUT_MS = 45000; // 服务端 30s，客户端 45s 兜底（§3.6）
const trPop = $('tr-pop');
let trBusy = false;
let trSeq = 0;                      // 过期保护：换选区/换文献后旧译文不得盖上来（仿 renderToken）

/**
 * 让**在飞**的划词翻译请求失效（R-01）。调用点：`showAskPop`（新选区/新引用）与 `openPaper`（换文献）。
 * 只自增 `trSeq` 会让旧请求的 `finally` 因为 `seq !== trSeq` 而不清 `trBusy`（按钮从此永久失效），
 * 所以这里一并把 busy 复位；旧响应回来时 `seq` 不匹配 ⇒ 直接丢弃，绝不会写到新锚点的气泡上。
 */
function invalidateTranslate() {
  trSeq++;
  trBusy = false;
  // 顺手收起气泡并清掉内容：在飞请求回来时会被 seq 拦下，**不会**再写气泡，
  // 所以留着「翻译中…」或上一篇的译文都是误导（N-01 的窗口里尤其明显）。
  hideTrPop();
  $('tr-status').textContent = '';
  $('tr-body').textContent = '';
  $('tr-note').textContent = '';
}

function hideTrPop() { trPop.style.display = 'none'; }

/* ── 译文里的公式渲染（vendored KaTeX，离线）────────────────────────────────────────────
   译文是**模型输出，当不可信数据**处理，所以这里绝不 innerHTML：
     · 文本段：一律 textContent；
     · 数学段：KaTeX 渲染进**我们新建的**元素（trust:false → 不产原始 HTML；strict:'ignore'）；
     · 渲染失败：该段**降级**为原始 LaTeX 文本（可读可复制），并在 #tr-note 如实提示第几个失败。
   `splitTranslatedMath` / `trComposeNote` 是纯函数，可在 vm 里单测。 */

/** 「这段 `$…$` 像不像数学」（与 src/translate-selection.ts 的 `isLatexLikeFragment` 同判据 + 两道收窄）。
 *  过度识别的代价更大：`$5 到 $10`、`$HOME/bin:$PATH` 这类一旦被当公式，正文会被 KaTeX 吃掉。
 *  规则（自上而下）：
 *    ① 含 LaTeX 特征（`\` `_` `^` `{` `}` `&`）⇒ 像数学；
 *    ② 含空白却没有特征 ⇒ 像散文/金额（`$5 up to $10`）⇒ 不是；
 *    ③ 全大写标识符（`HOME`、`PATH`）⇒ 不是；
 *    ④ `NAME:…` 形态（命令行/环境变量写法）⇒ 不是；
 *    ⑤ 其余短符号串（`x`、`QK`、`a/b`）⇒ 是（上限 24 字符，避免把长路径吃掉）。 */
function looksLikeMath(tex) {
  const t = String(tex);
  if (!t.trim()) return false;
  if (/[\\_^{}&]/.test(t)) return true;
  if (/\s/.test(t)) return false;
  if (/^[A-Z][A-Z0-9_]*$/.test(t)) return false;
  if (/^[A-Za-z0-9_./-]+:/.test(t)) return false;
  return t.length <= 24;
}

/** 把译文切成 [{kind:'text'|'math', text, display, delim}]。
 *  `$$…$$` 独立成行（可跨行）；`$…$` 行内（不跨行，避免把整段散文吞进公式）；`\$` 是字面美元号；
 *  `\(…\)` 行内、`\[…\]` 独立成行（模型/上游有时给这套定界符，见 pr7 诊断 P2）；
 *  定界符没有闭合、或 `$…$` 内容不像数学时按普通字符处理（绝不产生"半个公式"，也不吃正文）。 */
function splitTranslatedMath(input) {
  const s = String(input ?? '');
  const out = [];
  let buf = '';
