<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文伴读 · dsh-paper-reader</title>
<!-- pdf.js 6.x 本地 vendor（不再走 CDN）：3.11 的字体解析对 babeldoc 嵌入的 CID 字体会回退成黑体 -->
<script type="module">
  import * as pdfjsLib from '/paper-reader/vendor/pdf.min.mjs';
  window.pdfjsLib = pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/paper-reader/vendor/pdf.worker.min.mjs';
</script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #24292f;
    --text-2: #656d76; --accent: #0969da; --accent-soft: rgba(9,105,218,.12);
    --hl: rgba(255, 196, 0, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.6 -apple-system, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
  #bar button { font: inherit; }
  /* flex:none —— 列被拖窄时按钮不许被压缩（否则文字竖排、按钮变窄条） */
  .tbtn { flex: none; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  .tbtn:hover { background: var(--bg); }
  .tbtn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tbtn:disabled { opacity: .45; cursor: default; }
  #zh-toggle { font-weight: 700; }
  #zoom-label { flex: none; min-width: 44px; text-align: center; color: var(--text-2); }
  #bar .spacer { flex: 1; }
  /* min-width:0 —— flex 项默认 min-width:auto 会拒绝收缩，空间不够时转而去挤按钮；
     让标题自己截断（已有 ellipsis），按钮才能保持原样 */
  #status { min-width: 0; color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- PDF 区 ---------- */
  #main { display: flex; flex: 1; min-height: 0; }
  #pdf-pane { flex: 1; overflow: auto; padding: 16px; }
  /* safe center：页宽超过视口时退回左对齐——普通 center 会让左右同时溢出且左侧滚不到 */
  #pdf-pages { display: flex; flex-direction: column; align-items: safe center; gap: 14px; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .page.flash { outline: 3px solid var(--hl); outline-offset: 2px; transition: outline .15s; }
  /* textLayer CSS 必须是 pdf.js 6.x 官方规则的子集：TextLayer 只往 span 写 --font-height/--scale-x/--rotate
     变量，font-size 和 transform 全靠这里的 calc 表达式撑开；缺了的话 span 会按 body 字号渲染，
     盒子与 canvas 字形错位 —— 表现为选中高亮缺字符。--scale-factor 由 JS 在渲染时写入 */
  .textLayer {
    position: absolute; inset: 0; overflow: clip; line-height: 1; text-align: initial;
    letter-spacing: normal; word-spacing: normal; text-size-adjust: none;
    forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 0;
    --total-scale-factor: calc(var(--scale-factor, 1) * var(--user-unit, 1));
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size, 1));
    --min-font-size-inv: calc(1 / var(--min-font-size, 1));
    --scale-round-x: 1px; --scale-round-y: 1px;
  }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; user-select: text; }
  .textLayer > :not(.markedContent),
  .textLayer .markedContent span:not(.markedContent) {
    z-index: 1;
    --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(22,93,255,.3); }
  .textLayer br::selection { background: transparent; }
  /* 跳转链接的片段高亮（&q= 引文定位）：停留约 3.5s 后淡出 */
  .textLayer span.dpr-hl { animation: dpr-hl-fade 5s ease forwards; border-radius: 2px; }
  @keyframes dpr-hl-fade { 0%, 70% { background: rgba(255,196,0,.5); } 100% { background: transparent; } }
  #empty { margin: 60px auto; color: var(--text-2); text-align: center; max-width: 420px; }

  /* ---------- 选中即问浮层 ---------- */
  #ask-pop { position: fixed; z-index: 50; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px; width: 320px; }
  #ask-quote { font-size: 12px; color: var(--text-2); max-height: 64px; overflow: hidden; margin-bottom: 8px; border-left: 3px solid var(--accent-soft); padding-left: 8px; }
  #ask-input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; resize: none; }
  #ask-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #ask-send { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  #ask-send:disabled { opacity: .5; cursor: default; }
  #ask-cancel { background: none; border: none; color: var(--text-2); cursor: pointer; }

  /* ---------- 翻译端点设置浮层 ---------- */
  /* 阅读器在窄 iframe 里，宽度要能收缩 */
  #cfg-pop { position: fixed; z-index: 60; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px; width: min(320px, calc(100vw - 32px)); }
  #cfg-pop h3 { margin: 0; font-size: 13px; }
  #cfg-hint { font-size: 12px; color: var(--text-2); margin: 4px 0 2px; }
  #cfg-pop label { display: block; font-size: 12px; color: var(--text-2); margin: 8px 0 2px; }
  #cfg-pop input, #cfg-pop select { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; background: var(--panel); color: var(--text); }
  #cfg-model-hint, #cfg-source { font-size: 11.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
  #cfg-source:empty { display: none; }
  #cfg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  #cfg-save { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  #cfg-save:disabled { opacity: .5; cursor: default; }
  #cfg-cancel { background: none; border: none; color: var(--text-2); cursor: pointer; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; max-width: 70%; }
</style>
</head>
<body>

<div id="bar">
  <span id="status">论文伴读</span>
  <button id="zh-toggle" class="tbtn" title="切换中文译文（没有译文时可生成）" style="display:none">中</button>
  <button id="zh-regen" class="tbtn" title="重新翻译：删除现有译文，用当前端点重跑（换模型后用）" style="display:none">↻</button>
  <span class="spacer"></span>
  <button id="cfg-open" class="tbtn" title="翻译端点设置">⚙</button>
  <button id="zoom-out" class="tbtn">−</button>
  <span id="zoom-label">100%</span>
  <button id="zoom-in" class="tbtn">＋</button>
  <button id="zoom-fit" class="tbtn">适宽</button>
</div>

<div id="main">
  <div id="pdf-pane">
    <div id="pdf-pages"></div>
    <div id="empty" style="display:none"></div>
  </div>
</div>

<div id="ask-pop">
  <div id="ask-quote"></div>
  <textarea id="ask-input" rows="2" placeholder="围绕选中内容提问…"></textarea>
  <div id="ask-actions">
    <button id="ask-cancel">取消</button>
    <button id="ask-send">提问</button>
  </div>
</div>

<div id="cfg-pop">
  <h3>翻译端点</h3>
  <div id="cfg-hint">选预设供应商，或选「自定义」填任意 OpenAI 兼容端点（通义 / 本地 vLLM 等）。保存前会先测试连接。</div>
  <div id="cfg-source"></div>
  <label for="cfg-provider">供应商</label>
  <select id="cfg-provider"></select>
  <label for="cfg-url">端点 URL</label>
  <input id="cfg-url" type="text" placeholder="https://api.deepseek.com/v1" autocomplete="off">
  <label for="cfg-key">API Key</label>
  <input id="cfg-key" type="password" placeholder="sk-..." autocomplete="new-password">
  <label for="cfg-model">模型</label>
  <input id="cfg-model" type="text" placeholder="deepseek-chat" autocomplete="off" list="cfg-model-list">
  <datalist id="cfg-model-list"></datalist>
  <div id="cfg-model-hint">glm-5.x / k3 / deepseek-flash 是推理型模型，服务端已自动关闭思考；选自定义端点时建议用非推理模型，否则会慢好几倍。</div>
  <div id="cfg-actions">
    <button id="cfg-cancel">取消</button>
    <button id="cfg-save">保存</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ================= 基础 ================= */
const $ = (id) => document.getElementById(id);
const api = (p, opts) => fetch('/paper-reader/api' + p, opts).then(async (r) => {
  if (!r.ok) {
    // 服务端错误体有两种：{error}（参数/权限）与 {reason}（zh/generate 的未启动原因，带完整说明）
    const body = await r.json().catch(() => ({}));
    const err = new Error(body.error || body.reason || ('HTTP ' + r.status));
    err.code = body.code;   // 机器可读码（如 no-endpoint）——让调用方靠它分支，别去匹配中文文案
    err.status = r.status;
    throw err;
  }
  return r.json();
});
function toast(msg, ms = 3200) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let current = null;        // { topic, name }
let zhState = { zh: false, dual: false, busy: false };
let zhVariant = null;      // null=原文 'dual'=中英对照 'zh'=纯中文
// 每篇论文记住上次用的语言版本：伴读会话的跳转链接原地跳页不重载，
// 加上这里的恢复，「中文界面跳中文」在同篇跳转/重开/跨论文三条路径上都成立
const variantKey = (topic, name) => `dpr.variant.${topic}/${name}`;

/* ================= 打开文献 ================= */
function pdfUrl(variant) {
  const q = `topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`;
  return `/paper-reader/api/pdf?${q}${variant ? '&variant=' + variant : ''}&t=${Date.now()}`;
}

async function openPaper(topic, name, opts = {}) {
  if (!name) return;
  current = { topic, name };
  localStorage.setItem('dpr.last', JSON.stringify(current));
  $('status').textContent = '加载 PDF…';
  const q = `topic=${encodeURIComponent(topic)}&name=${encodeURIComponent(name)}`;
  const meta = await api('/paper?' + q);
  $('status').textContent = meta.hasTranscript
    ? `${name} · ${meta.pageCount ?? '?'} 页`
    : `${name} · 未转录（提问时会自动转录）`;
  await refreshZhState();
  // 恢复该论文上次的语言版本（译文已不存在时回落原文）
  const saved = localStorage.getItem(variantKey(topic, name));
  zhVariant = (saved === 'zh' && zhState.zh) || (saved === 'dual' && zhState.dual) ? saved : null;
  $('zh-toggle').classList.toggle('active', zhVariant !== null);
  if (zhVariant) { fitMode = true; fitBtn.classList.add('active'); } // 译文版页宽不同，强制适宽
  await loadPdf(pdfUrl(zhVariant));
  if (opts.page) jumpTo(opts.page, opts.q); // 不 await：跳转内部自带「等页面渲出来」轮询
}

/* ================= 中英切换 ================= */
async function refreshZhState() {
  zhState = await api(`/zh?topic=${encodeURIComponent(current.topic)}&name=${encodeURIComponent(current.name)}`);
  const btn = $('zh-toggle');
  btn.style.display = '';
  btn.disabled = zhState.busy;
  btn.textContent = zhState.busy ? '译' : '中';
  btn.title = zhState.busy ? (zhState.phase || `翻译进行中${zhState.model ? `（${zhState.model}）` : ''}…`)
    : (zhState.zh || zhState.dual) ? '切换中文译文'
    : '还没有中文版，点击生成（babeldoc，需要几分钟）';
  // 安装/准备阶段在状态栏持续可见（轮询每 5s 刷新一次）
  if (zhState.busy && zhState.phase) $('status').textContent = zhState.phase;
  // ↻ 只在「已有译文且空闲」时出现；状态变化时顺手拆掉两击确认的待确认态
  const regen = $('zh-regen');
  const canRegen = (zhState.zh || zhState.dual) && !zhState.busy;
  regen.style.display = canRegen ? '' : 'none';
  if (!canRegen) disarmRegen();
}

$('zh-toggle').onclick = async () => {
  if (!current || zhState.busy) return;
  if (zhState.dual || zhState.zh) {
    // 两态切换：原文 ↔ 纯中文；只存在对照版时退到对照
    zhVariant = zhVariant === null ? (zhState.zh ? 'zh' : 'dual') : null;
    localStorage.setItem(variantKey(current.topic, current.name), zhVariant ?? '');
    $('zh-toggle').classList.toggle('active', zhVariant !== null);
    // 切换变体后强制适宽：译文版页宽与原文不同（对照双栏≈2×），不重算会溢出裁切
    fitMode = true; fitBtn.classList.add('active');
    await loadPdf(pdfUrl(zhVariant));
    return;
  }
  await startGenerate(false);
};

// 生成/重翻共用：force=true 时服务端先删旧译文再启动；成功后轮询到完成
async function startGenerate(force) {
  try {
    const r = await api('/zh/generate', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(force ? { ...current, force: true } : current),
    });
    const m = zhState.model ? `（${zhState.model}）` : '';
    toast(r.firstRun
      ? '首次使用：正在自动安装翻译引擎（uv + Python + babeldoc，约几分钟），装完自动开始翻译…'
      : (force ? `已删除旧译文，开始重新翻译${m}…` : `开始生成中文版${m}（约几分钟）…`), 6000);
  } catch (e) {
    // 没配端点 → 直接弹配置表单；填好保存后自动回来重试（记住是不是重翻）
    if (e.code === 'no-endpoint') { cfgRetryForce = force; openCfgPop(true); return; }
    toast(e.message, 8000); return;
  }
  $('zh-toggle').disabled = true; $('zh-toggle').textContent = '译';
  $('zh-regen').style.display = 'none';
  const timer = setInterval(async () => {
    await refreshZhState();
    if (!zhState.busy) {
      clearInterval(timer);
      if (zhState.dual || zhState.zh) {
        toast('中文版已生成');
        // 重翻完成时用户可能正停在译文视图：原地刷新同一变体，而不是来回切换
        if (zhVariant) await loadPdf(pdfUrl(zhVariant));
        else $('zh-toggle').click();
      }
      else toast('生成失败：' + (zhState.error || '未知原因'), 8000);
    }
  }, 5000);
}

/* ================= 重新翻译（↻，两击确认） ================= */
// 不用原生 confirm：阅读器跑在 dsh 桌面壳的 iframe 里，原生对话框行为不可靠。
// 第一击把按钮变成「重翻?」待确认态（3 秒有效），第二击才真删真跑。
let regenArmTimer = null;
function disarmRegen() {
  clearTimeout(regenArmTimer); regenArmTimer = null;
  const btn = $('zh-regen');
  btn.textContent = '↻'; btn.classList.remove('active');
}
$('zh-regen').onclick = async () => {
  if (!current || zhState.busy) return;
  const btn = $('zh-regen');
  if (regenArmTimer) {           // 第二击：确认执行
    disarmRegen();
    await startGenerate(true);
    return;
  }
  btn.textContent = '重翻?';      // 第一击：进入待确认态
  btn.classList.add('active');
  regenArmTimer = setTimeout(disarmRegen, 3000);
};

/* ================= 翻译端点设置 ================= */
// 供应商预设（OpenAI 兼容端点，对齐 lflow 的供应商清单）：选中即回填 URL + 推荐模型。
// 一律走 Coding 套餐端点——买套餐是常态；套餐 key 走按量口会报余额不足。按量用户选「自定义」手填。
// models 仅作 datalist 建议，输入框仍可自由填写（新型号上线不用发版）。
// glm-5.x / k3 / deepseek-flash 是推理型，服务端会对这三家域名自动关 thinking（translate.ts）。
const PROVIDERS = [
  { id: 'custom',   name: '自定义（OpenAI 兼容）', baseUrl: '', models: [] },
  { id: 'deepseek', name: 'DeepSeek',  baseUrl: 'https://api.deepseek.com',                     models: ['deepseek-v4-pro', 'deepseek-flash'] },
  { id: 'glm',      name: '智谱 GLM',   baseUrl: 'https://open.bigmodel.cn/api/coding/paas/v4', models: ['glm-5.3-flash', 'glm-5.3', 'glm-4.6'] },
  { id: 'kimi',     name: 'Kimi',      baseUrl: 'https://api.kimi.com/coding/v1',              models: ['k3'] },
];
const normUrl = (u) => (u || '').trim().replace(/\/+$/, '');
// 按 baseUrl 反查预设（打开表单时回显选中项）；查不到就是 custom
const providerOf = (baseUrl) => PROVIDERS.find((p) => p.id !== 'custom' && normUrl(p.baseUrl) === normUrl(baseUrl)) || PROVIDERS[0];

(function initProviderSelect() {
  const sel = $('cfg-provider');
  for (const p of PROVIDERS) {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    const p = PROVIDERS.find((x) => x.id === sel.value) || PROVIDERS[0];
    if (p.baseUrl) $('cfg-url').value = p.baseUrl;   // custom 不动用户已填的 URL
    $('cfg-model-list').innerHTML = p.models.map((m) => `<option value="${esc(m)}">`).join('');
    if (p.models.length && !p.models.includes($('cfg-model').value.trim())) $('cfg-model').value = p.models[0];
  };
})();

// 保存成功后是否自动接着生成：点「中」/「↻」发现没配 → 弹本表单 → 填完直接开跑
let cfgRetryGenerate = false;
let cfgRetryForce = false;   // 待重试的是不是「重翻」（↻ 进来时旧译文还在，zh-toggle 点击语义不对，必须带 force）

async function openCfgPop(retryGenerate) {
  cfgRetryGenerate = Boolean(retryGenerate);
  let cfg;
  try {
    cfg = await api('/translate/config');
  } catch (e) { toast('读取配置失败：' + e.message, 8000); return; }
  $('cfg-url').value = cfg.baseUrl || '';
  $('cfg-model').value = cfg.model || '';
  // 按已存 URL 回显供应商，并触发一次 onchange 补齐模型候选（但不覆盖已存模型/URL）
  const sel = $('cfg-provider');
  sel.value = providerOf(cfg.baseUrl).id;
  const keepUrl = $('cfg-url').value, keepModel = $('cfg-model').value;
  sel.onchange();
  $('cfg-url').value = keepUrl || $('cfg-url').value;
  $('cfg-model').value = keepModel || $('cfg-model').value;
  // 明文 key 不回传：留空 = 沿用已存的那把
  $('cfg-key').value = '';
  $('cfg-key').placeholder = cfg.hasApiKey ? `已保存（${cfg.apiKeyHint}），留空则不修改` : 'sk-...';
  // 生效配置的来源：界面保存的文件 优先于 profile 的 YAML 默认值——两条来源都有时不说明会分不清生效的是谁
  $('cfg-source').textContent =
    cfg.source === 'file' ? `当前生效：本界面保存的配置（key ${cfg.apiKeyHint}）`
    : cfg.source === 'profile' ? '当前生效：profile 默认配置（在本界面保存后会被覆盖）'
    : '';
  const pop = $('cfg-pop');
  pop.style.display = 'block';
  // 先显示再量尺寸（不像 #ask-pop 那样写死尺寸常量，免得跟 CSS 漂移）
  pop.style.left = Math.max(8, (window.innerWidth - pop.offsetWidth) / 2) + 'px';
  pop.style.top = Math.max(8, (window.innerHeight - pop.offsetHeight) / 3) + 'px';
  $('cfg-key').focus();
}
function closeCfgPop() { $('cfg-pop').style.display = 'none'; cfgRetryGenerate = false; cfgRetryForce = false; }

$('cfg-open').onclick = () => openCfgPop(false);
$('cfg-cancel').onclick = closeCfgPop;

$('cfg-save').onclick = async () => {
  // retry/force 先捞出来：closeCfgPop 会把这两个待确认态清零
  const btn = $('cfg-save'), label = btn.textContent, retry = cfgRetryGenerate, force = cfgRetryForce;
  btn.disabled = true; btn.textContent = '测试中…';
  try {
    // 服务端先打一发极小的 chat/completions 验证 url/key/model，通过才落盘
    await api('/translate/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        baseUrl: $('cfg-url').value.trim(),
        apiKey: $('cfg-key').value.trim(),
        model: $('cfg-model').value.trim(),
      }),
    });
  } catch (e) {
    toast('保存失败：' + e.message, 8000);
    return;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
  closeCfgPop();
  await refreshZhState();
  if (retry) startGenerate(force);  // 沿用触发来源的语义：「中」=生成，「↻」=重翻
  else toast('翻译端点已保存');
};

/* ================= PDF 渲染(pdf.js:缩放 + devicePixelRatio 高清,移植自 pdfqa) ================= */
/* pdfjsLib 与 workerSrc 由头部 module 脚本设置（本地 vendor，pdf.js 6.x） */

let pdfDoc = null;
let zoomScale = 1.5;
let dpr = window.devicePixelRatio || 1;
let renderToken = 0;

(function watchDpr() {
  const mq = matchMedia(`(resolution: ${dpr}dppx)`);
  mq.addEventListener('change', function onChange() {
    mq.removeEventListener('change', onChange);
    dpr = window.devicePixelRatio || 1;
    if (pdfDoc) renderAllPages();
    watchDpr();
  });
})();

async function loadPdf(url) {
  pdfDoc = await pdfjsLib.getDocument({ url }).promise; // v6 起不接受字符串参数，必须传对象
  $('empty').style.display = 'none';
  if (fitMode) { fitToWidth(); return; } // fitToWidth 内部 setZoom → renderAllPages
  await renderAllPages();
}

async function renderAllPages() {
  const token = ++renderToken;
  const container = $('pdf-pages');
  const pane = $('pdf-pane');
  if (pane.clientHeight === 0) return; // 悬浮层隐藏期间不重渲（否则锚点恢复会把滚动清零）
  // 滚动比例锚点：不用 DOM rect（并发重渲时旧页可能已被清空，rect 全灭 → 锚点归零）
  const range = pane.scrollHeight - pane.clientHeight;
  const anchorRatio = range > 0 ? pane.scrollTop / range : 0;
  container.innerHTML = '';
  $('zoom-label').textContent = Math.round(zoomScale / 1.5 * 100) + '%';

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (token !== renderToken) return;
    const page = await pdfDoc.getPage(i);
    if (token !== renderToken) return;
    const viewport = page.getViewport({ scale: zoomScale });
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.page = i;
    div.style.width = viewport.width + 'px';

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width * dpr);
    canvas.height = Math.ceil(viewport.height * dpr);
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';
    div.appendChild(canvas);

    const tl = document.createElement('div');
    tl.className = 'textLayer';
    tl.style.width = viewport.width + 'px';
    tl.style.height = viewport.height + 'px';
    tl.style.setProperty('--scale-factor', String(zoomScale));
    div.appendChild(tl);
    container.appendChild(div);

    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
    }).promise;
    if (token !== renderToken) return;
    const tc = await page.getTextContent();
    if (token !== renderToken) return;
    // pdf.js 6.x: renderTextLayer() 移除，改 TextLayer 类
    await new pdfjsLib.TextLayer({ textContentSource: tc, container: tl, viewport }).render();
  }
  const newRange = pane.scrollHeight - pane.clientHeight;
  pane.scrollTop = anchorRatio * Math.max(0, newRange);
}

function setZoom(newScale) { if (!pdfDoc) return; zoomScale = Math.min(4.5, Math.max(0.6, newScale)); renderAllPages(); }
// 默认适宽：rightbar 窄列里 1.5 倍缩放会把页面撑出视口（中英对照双栏页宽≈2×，更明显）
let fitMode = true;
const fitBtn = $('zoom-fit');
fitBtn.classList.add('active');
function exitFitMode() { fitMode = false; fitBtn.classList.remove('active'); }
function fitToWidth() {
  if (!pdfDoc) return // resize 可能先于首次 loadPdf 触发（布局换位/条带注入会改容器尺寸）
  const paneWidth = $('pdf-pane').clientWidth - 32
  if (paneWidth <= 0) return // 隐藏期间尺寸为 0，算出的缩放无意义
  pdfDoc.getPage(1).then((p) => setZoom(paneWidth / p.getViewport({ scale: 1 }).width))
}
$('zoom-in').onclick = () => { exitFitMode(); setZoom(zoomScale + 0.25); };
$('zoom-out').onclick = () => { exitFitMode(); setZoom(zoomScale - 0.25); };
fitBtn.onclick = () => { if (!pdfDoc) return; fitMode = true; fitBtn.classList.add('active'); fitBtn.blur(); fitToWidth(); };
window.addEventListener('resize', () => { if (fitMode) fitToWidth(); });

function jumpToPage(n) {
  const div = document.querySelector(`.page[data-page="${n}"]`);
  if (!div) return;
  div.scrollIntoView({ behavior: 'smooth', block: 'start' });
  div.classList.add('flash');
  setTimeout(() => div.classList.remove('flash'), 1600);
}

/* 片段定位高亮（跳转链接的 &q= 引文）：在指定页 textLayer 里找 q、高亮并滚到它。
   归一化时忽略空白/连字符/软连字符、大小写 —— 论文跨行断词（dis-tributed）也能命中。
   找不到（如用户在中文界面而 q 是英文原文）返回 false，调用方退回仅跳页。 */
let hlTimer = null;
function highlightSnippet(page, q) {
  const spans = [...(document.querySelector(`.page[data-page="${page}"]`)?.querySelectorAll('.textLayer span:not(.markedContent)') ?? [])];
  if (!spans.length || !q) return false;
  let hay = '';
  const startOf = [];
  for (const sp of spans) { startOf.push(hay.length); hay += sp.textContent; }
  // 归一化串 + 回原串的索引映射（归一化改变长度，不能直接用原索引）
  const map = [];
  let nh = '';
  for (let i = 0; i < hay.length; i++) {
    const c = hay[i].toLowerCase();
    if (/\s/.test(c) || c === '-' || c === '­') continue;
    nh += c; map.push(i);
  }
  const needle = q.toLowerCase().replace(/[\s\-­]+/g, '');
  const at = needle ? nh.indexOf(needle) : -1;
  if (at < 0) return false;
  const from = map[at], to = map[at + needle.length - 1] + 1;
  const hit = spans.filter((sp, i) => startOf[i] < to && startOf[i] + sp.textContent.length > from);
  if (!hit.length) return false;
  clearTimeout(hlTimer);
  document.querySelectorAll('.textLayer span.dpr-hl').forEach((sp) => sp.classList.remove('dpr-hl'));
  for (const sp of hit) sp.classList.add('dpr-hl');
  hit[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  hlTimer = setTimeout(() => hit.forEach((sp) => sp.classList.remove('dpr-hl')), 5200);
  return true;
}

/* 统一跳转入口：先等目标页渲染出来（fit 模式下 loadPdf 返回时页面可能还在渲），
   有 q 就尝试片段高亮，否则整页跳转 + 边框闪烁 */
async function jumpTo(page, q) {
  const p0 = Math.max(1, (page | 0) || 1);
  for (let i = 0; i < 100; i++) {
    if (pdfDoc && document.querySelector(`.page[data-page="${Math.min(p0, pdfDoc.numPages)}"]`)) {
      const p = Math.min(p0, pdfDoc.numPages);
      if (!(q && highlightSnippet(p, q))) jumpToPage(p);
      return;
    }
    await new Promise((r) => setTimeout(r, 100));
  }
}

/* ================= 选中即问 ================= */
const askPop = $('ask-pop');
let askSelection = null;

document.addEventListener('mouseup', (e) => {
  if (askPop.contains(e.target)) return;
  setTimeout(() => {
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim() : '';
    if (!text || !current) { askPop.style.display = 'none'; return; }
    const node = sel.anchorNode && sel.anchorNode.parentElement;
    if (!node || !node.closest('.textLayer')) { askPop.style.display = 'none'; return; }
    const range = sel.getRangeAt(0).getBoundingClientRect();
    askSelection = { text, page: +((node.closest('.page') || {}).dataset?.page || 0) || null };
    $('ask-quote').textContent = text.length > 140 ? text.slice(0, 140) + '…' : text;
    $('ask-input').value = '';
    askPop.style.display = 'block';
    // 夹在 iframe 视口内（rightbar 窄列里也要能用）
    const popW = 336, popH = 190;
    const x = Math.max(8, Math.min(e.clientX, window.innerWidth - popW - 8));
    const y = Math.max(8, Math.min(range.bottom + 8, window.innerHeight - popH - 8));
    askPop.style.left = x + 'px';
    askPop.style.top = y + 'px';
    $('ask-input').focus();
  }, 10);
});
document.addEventListener('mousedown', (e) => { if (!askPop.contains(e.target)) askPop.style.display = 'none'; });
$('ask-cancel').onclick = () => { askPop.style.display = 'none'; };

$('ask-send').onclick = async () => {
  const question = $('ask-input').value.trim();
  if (!question || !askSelection || !current) return;
  $('ask-send').disabled = true;
  try {
    // 会话序号由侧栏树激活时写入 localStorage（默认最新）
    const key = `dpr.sessionN.${current.topic}/${current.name}`;
    const n = +(localStorage.getItem(key) || 0) || undefined;
    const r = await api('/ask', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...current, question, selectedText: askSelection.text, page: askSelection.page, ...(n ? { n } : {}) }),
    });
    askPop.style.display = 'none';
    toast(`已发送到 会话${r.n}，回答见对话区`);
  } catch (e) { toast('提问失败：' + e.message, 6000); }
  $('ask-send').disabled = false;
};
$('ask-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask-send').click(); } });

/* ================= 启动：URL 参数 > localStorage > 第一篇 ================= */
async function bootstrap() {
  const params = new URLSearchParams(location.search);
  const pTopic = params.get('topic'), pName = params.get('name');
  // 伴读会话里的跳转链接（[重读第 N 页](…?page=N)）经此直达目标页
  const pPage = +(params.get('page') || 0) || undefined;
  const pQ = params.get('q') || undefined;
  const lib = await api('/library');
  if (lib.topics.length === 0) {
    $('empty').style.display = 'block';
    $('empty').innerHTML = '文献库为空。<br>在左侧文献库树上传 PDF 或新建专题即可开始。';
    return;
  }
  let target = null;
  if (pTopic && pName && lib.papers.some((p) => p.topic === pTopic && p.name === pName)) target = { topic: pTopic, name: pName };
  else {
    const last = JSON.parse(localStorage.getItem('dpr.last') || 'null');
    if (last && lib.papers.some((p) => p.topic === last.topic && p.name === last.name)) target = last;
    else target = lib.papers[0];
  }
  if (target) await openPaper(target.topic, target.name, { page: pPage, q: pQ });
}
bootstrap().catch((e) => {
  $('empty').style.display = 'block';
  $('empty').textContent = '文献库加载失败：' + e.message;
});

window.dpr = {
  openPaper: (topic, name, page, q) => openPaper(topic, name, { page, q }),
  jumpToPage,
  // 伴读会话的跳转链接用：当前文档里原地跳转，不重载 —— 用户正在看中文版就落在中文版；
  // 带 q（原文短引文）时定位并闪烁高亮对应片段，找不到则退回整页跳转
  jumpPage: (n, q) => { jumpTo(n, q); },
};
</script>
